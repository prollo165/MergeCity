<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Entspricht dem Rahmen, den die Artifact-Plattform beim Veröffentlichen ergänzt. -->
<style>
  :root { color-scheme: dark; }
  body { margin: 0; font: 14px system-ui, -apple-system, sans-serif; }
  img { max-width: 100%; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<title>Prallwerk 9:16</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
  /* Prallwerk ist bewusst einfarbig dunkel gehalten: Man beurteilt ein
     Videobild gegen dunkles Gehäuse, nicht gegen weißes Papier. Alle Farben
     werden darum explizit gesetzt, damit die Seite auf jedem Wirtsgrund hält. */
  :root {
    color-scheme: dark;
    --ink: #0e0d0b;
    --chassis: #171612;
    --raised: #211f19;
    --raised-hi: #2a2721;
    --rule: #38332a;
    --rule-soft: #26231d;
    --silk: #f0eadd;
    --dim: #968d7e;
    --dimmer: #6b6459;
    --signal: #e8a33d;
    --signal-soft: rgba(232, 163, 61, .18);
    --signal-ink: #1a1408;
    --tally: #e5484d;
    --cool: #6f8fa8;
    --font-ui: "IBM Plex Sans", ui-sans-serif, system-ui, sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace;
    --font-display: "Archivo Black", "Arial Black", Impact, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--ink);
    color: var(--silk);
    font-family: var(--font-ui);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }

  .shell { max-width: 1020px; margin: 0 auto; padding: 20px 22px 44px; }

  /* ---------- Kopf ---------- */
  .hdr { display: flex; align-items: center; gap: 10px 18px; flex-wrap: wrap; }
  .bank {
    display: flex; align-items: center; gap: 10px 14px; flex-wrap: wrap;
    padding: 12px 0 13px; border-bottom: 1px solid var(--rule);
  }
  .bank-label {
    font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .2em;
    text-transform: uppercase; color: var(--dimmer);
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .wordmark {
    font-family: var(--font-display); font-size: 25px; line-height: 1;
    letter-spacing: -.015em; text-transform: uppercase; color: var(--silk);
  }
  .wordmark span { color: var(--signal); }
  .badge {
    font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .1em;
    color: var(--cool); border: 1px solid rgba(111, 143, 168, .45);
    border-radius: 4px; padding: 2px 6px; align-self: center;
  }
  .tagline {
    font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--dim);
  }
  .presets { display: flex; gap: 7px; flex-wrap: wrap; }
  .chip {
    font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--dim); background: transparent;
    border: 1px solid var(--rule); border-radius: 999px; padding: 6px 11px;
    cursor: pointer; transition: color .12s, border-color .12s, background .12s;
  }
  .chip:hover { color: var(--silk); border-color: var(--dimmer); }
  .chip[aria-pressed="true"] { color: var(--signal-ink); background: var(--signal); border-color: var(--signal); }

  /* ---------- Konsole ---------- */
  .console {
    display: grid; grid-template-columns: minmax(0, 1fr) 356px;
    gap: 26px; align-items: start; margin-top: 20px;
  }
  @media (max-width: 1000px) { .console { grid-template-columns: 1fr; } }

  /* ---------- Bühne ---------- */
  .stage {
    /* Die Bühne wird von der Höhe her gedacht – ein 9:16-Bild soll ganz
       ins Fenster passen, die Blende folgt dieser Breite. */
    --screen-w: calc(min(64vh, 720px) * 9 / 16);
    display: flex; flex-direction: column; gap: 12px; align-items: center;
  }
  @media (max-width: 1000px) { .stage { --screen-w: min(420px, 100%); } }
  .tallybar {
    display: flex; align-items: center; gap: 9px; width: 100%;
    max-width: var(--screen-w); font-family: var(--font-mono); font-size: 10.5px;
    letter-spacing: .14em; text-transform: uppercase; color: var(--dimmer);
  }
  .lamp {
    width: 9px; height: 9px; border-radius: 50%;
    background: #3a2b28; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .6);
  }
  .lamp.live { background: var(--tally); box-shadow: 0 0 10px 1px rgba(229, 72, 77, .8); animation: pulse 1.1s infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .tallybar .sep { margin-left: auto; }

  .bezel {
    position: relative; padding: 11px; border-radius: 12px;
    background: linear-gradient(180deg, var(--raised-hi), var(--chassis));
    border: 1px solid var(--rule);
    box-shadow: 0 22px 44px -26px #000, inset 0 1px 0 rgba(255, 255, 255, .04);
    width: var(--screen-w); max-width: 100%;
  }
  .screen {
    position: relative; border-radius: 5px; overflow: hidden; background: #05060a;
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .8);
  }
  canvas { display: block; width: 100%; height: auto; aspect-ratio: 9 / 16; }
  .mark { position: absolute; width: 15px; height: 15px; border: 1.5px solid rgba(111, 143, 168, .55); pointer-events: none; }
  .mark.tl { top: 5px; left: 5px; border-right: 0; border-bottom: 0; }
  .mark.tr { top: 5px; right: 5px; border-left: 0; border-bottom: 0; }
  .mark.bl { bottom: 5px; left: 5px; border-right: 0; border-top: 0; }
  .mark.br { bottom: 5px; right: 5px; border-left: 0; border-top: 0; }

  /* ---------- Messwerte ---------- */
  .readout {
    display: grid; grid-template-columns: repeat(5, 1fr); width: var(--screen-w);
    max-width: 100%; border: 1px solid var(--rule); border-radius: 8px;
    background: var(--chassis); overflow: hidden;
  }
  .readout div { padding: 8px 10px; border-left: 1px solid var(--rule-soft); }
  .readout div:first-child { border-left: 0; }
  .readout dt {
    font-family: var(--font-mono); font-size: 9.5px; letter-spacing: .16em;
    text-transform: uppercase; color: var(--dimmer); margin: 0;
  }
  .readout dd {
    margin: 1px 0 0; font-family: var(--font-mono); font-size: 15px;
    font-variant-numeric: tabular-nums; color: var(--silk); white-space: nowrap;
  }
  .readout dd.acc { color: var(--signal); }

  .transport { display: flex; gap: 8px; flex-wrap: wrap; width: var(--screen-w); max-width: 100%; }
  .transport .grow { flex: 1 1 auto; }

  /* ---------- Bedienschiene ----------
     Die Schiene scrollt in sich selbst, damit das Bild beim Schrauben an den
     unteren Modulen stehen bleibt. */
  .rail { border: 1px solid var(--rule); border-radius: 10px; background: var(--chassis); }
  @media (min-width: 1001px) {
    .stage, .rail { position: sticky; top: 14px; }
    .rail {
      max-height: calc(100vh - 28px); overflow-y: auto; overscroll-behavior: contain;
      scrollbar-width: thin; scrollbar-color: var(--rule) transparent;
    }
    .rail::-webkit-scrollbar { width: 10px; }
    .rail::-webkit-scrollbar-track { background: transparent; }
    .rail::-webkit-scrollbar-thumb {
      background: var(--rule); border-radius: 6px;
      border: 3px solid var(--chassis);
    }
    .rail::-webkit-scrollbar-thumb:hover { background: var(--dimmer); }
  }
  .mod { padding: 13px 15px 15px; border-top: 1px solid var(--rule-soft); }
  .mod:first-child { border-top: 0; }
  .mod > h2 {
    display: flex; align-items: baseline; gap: 8px; margin: 0 0 4px;
    font-family: var(--font-mono); font-size: 10px; font-weight: 500;
    letter-spacing: .2em; text-transform: uppercase; color: var(--dim);
  }
  .mod > h2 .hint {
    margin-left: auto; letter-spacing: .04em; text-transform: none;
    color: var(--dimmer); font-size: 10.5px;
  }

  .row { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 10px; padding: 5px 0; }
  .row > label { font-size: 12.5px; color: var(--silk); }
  .row .val {
    font-family: var(--font-mono); font-size: 11.5px; color: var(--signal);
    font-variant-numeric: tabular-nums;
  }
  .row .wide { grid-column: 1 / -1; }
  .row .note { grid-column: 1 / -1; font-size: 11px; color: var(--dimmer); }

  select, input[type="text"], input[type="number"] {
    font-family: var(--font-mono); font-size: 11.5px; color: var(--silk);
    background: var(--raised); border: 1px solid var(--rule); border-radius: 5px;
    padding: 6px 8px; width: 100%; min-width: 0;
  }
  select { cursor: pointer; }
  input[type="number"] { font-variant-numeric: tabular-nums; }

  input[type="range"] {
    -webkit-appearance: none; appearance: none; width: 100%;
    background: transparent; height: 20px; margin: 0; cursor: pointer;
  }
  input[type="range"]::-webkit-slider-runnable-track { height: 3px; border-radius: 2px; background: var(--rule); }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 13px; height: 13px;
    margin-top: -5px; border-radius: 50%; background: var(--signal);
    border: 2px solid var(--ink); box-shadow: 0 0 0 1px var(--signal);
  }
  input[type="range"]::-moz-range-track { height: 3px; border-radius: 2px; background: var(--rule); }
  input[type="range"]::-moz-range-thumb {
    width: 13px; height: 13px; border-radius: 50%; background: var(--signal);
    border: 2px solid var(--ink); box-shadow: 0 0 0 1px var(--signal);
  }

  .sw {
    -webkit-appearance: none; appearance: none; width: 36px; height: 19px;
    border-radius: 11px; background: var(--raised); border: 1px solid var(--rule);
    position: relative; cursor: pointer; transition: background .14s, border-color .14s;
  }
  .sw::after {
    content: ""; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px;
    border-radius: 50%; background: var(--dim); transition: transform .14s, background .14s;
  }
  .sw:checked { background: var(--signal-soft); border-color: var(--signal); }
  .sw:checked::after { transform: translateX(17px); background: var(--signal); }

  .btn {
    font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .12em;
    text-transform: uppercase; padding: 9px 13px; border-radius: 6px;
    border: 1px solid var(--rule); background: var(--raised); color: var(--silk);
    cursor: pointer; transition: background .12s, border-color .12s, color .12s;
  }
  .btn:hover:not(:disabled) { background: var(--raised-hi); border-color: var(--dimmer); }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn.primary { background: var(--signal); border-color: var(--signal); color: var(--signal-ink); font-weight: 500; }
  .btn.primary:hover:not(:disabled) { background: #f0b055; border-color: #f0b055; }
  .btn.rec { background: var(--tally); border-color: var(--tally); color: #fff; }
  .btn.rec:hover:not(:disabled) { background: #ef5a5f; border-color: #ef5a5f; }

  :focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }

  .mod.muted .row + .row { opacity: .42; }

  .filebtn {
    display: block; text-align: center; cursor: pointer;
    font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .12em;
    text-transform: uppercase; padding: 9px 13px; border-radius: 6px;
    border: 1px dashed var(--rule); background: var(--raised); color: var(--silk);
    transition: border-color .12s, background .12s;
  }
  .filebtn:hover, .filebtn.over { border-color: var(--signal); background: var(--raised-hi); }
  .filebtn input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  .filebtn:focus-within { outline: 2px solid var(--signal); outline-offset: 2px; }

  .status {
    grid-column: 1 / -1; font-family: var(--font-mono); font-size: 10.5px;
    line-height: 1.45; color: var(--dim); word-break: break-word;
  }
  .status.on { color: var(--signal); }

  input[type="color"] {
    width: 46px; height: 28px; padding: 2px; cursor: pointer;
    background: var(--raised); border: 1px solid var(--rule); border-radius: 5px;
  }

  .ed-tools { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 6px 0 2px; }
  .ed-tools .btn { padding: 8px 4px; }
  .ed-tools .btn[aria-pressed="true"] {
    background: var(--signal); border-color: var(--signal); color: var(--signal-ink);
  }
  .ed-actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .ed-actions .btn, .ed-actions .filebtn { flex: 1 1 auto; padding: 8px 10px; }
  .bezel.editing {
    border-color: var(--signal);
    box-shadow: 0 0 0 1px var(--signal), 0 22px 44px -26px #000;
  }

  .export-out {
    margin-top: 10px; padding: 10px 11px; border: 1px solid var(--rule);
    border-left: 2px solid var(--signal); border-radius: 6px; background: var(--raised);
    display: grid; gap: 8px;
  }
  .export-out p { margin: 0; font-family: var(--font-mono); font-size: 11px; color: var(--dim); }
  .export-out strong { color: var(--silk); font-weight: 500; }
  .export-out.warn { border-left-color: var(--tally); }

  footer {
    margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--rule);
    display: flex; gap: 10px 26px; flex-wrap: wrap;
    font-family: var(--font-mono); font-size: 10.5px; letter-spacing: .06em; color: var(--dimmer);
  }
  footer kbd {
    font-family: var(--font-mono); color: var(--silk); background: var(--raised);
    border: 1px solid var(--rule); border-radius: 3px; padding: 1px 5px; font-size: 10px;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition-duration: 0s !important; animation: none !important; }
  }
</style>

<div class="shell">
  <header class="hdr">
    <div class="brand">
      <div class="wordmark">Prall<span>werk</span></div>
      <div class="badge">9:16</div>
    </div>
    <p class="tagline">Bounce-Physik für Kurzvideos</p>
  </header>

  <div class="bank">
    <span class="bank-label">Vorlagen</span>
    <div class="presets" id="presets" role="group" aria-label="Voreinstellungen"></div>
  </div>

  <main class="console">
    <section class="stage" aria-label="Bühne">
      <div class="tallybar">
        <span class="lamp" id="lamp"></span>
        <span id="tallyText">Bereit</span>
        <span class="sep" id="recSize"></span>
      </div>

      <div class="bezel">
        <div class="screen">
          <canvas id="stage" width="720" height="1280"></canvas>
          <span class="mark tl"></span><span class="mark tr"></span>
          <span class="mark bl"></span><span class="mark br"></span>
        </div>
      </div>

      <dl class="readout">
        <div><dt>Bälle</dt><dd class="acc" id="mBalls">1</dd></div>
        <div><dt>Treffer</dt><dd id="mHits">0</dd></div>
        <div><dt>Lauf</dt><dd id="mTime">0.0s</dd></div>
        <div><dt>Bild/s</dt><dd id="mFps">60</dd></div>
        <div><dt>Seed</dt><dd id="mSeed">0000</dd></div>
      </dl>

      <div class="transport">
        <button class="btn primary grow" id="btnPlay">Pause</button>
        <button class="btn" id="btnReset">Neustart</button>
        <button class="btn" id="btnSeed">Neuer Seed</button>
        <button class="btn" id="btnEdit">Bearbeiten</button>
        <button class="btn rec grow" id="btnRec">Aufnahme</button>
      </div>
    </section>

    <section class="rail" id="rail" aria-label="Bedienelemente"></section>
  </main>

  <footer>
    <span><kbd>Leer</kbd> Start / Pause</span>
    <span><kbd>R</kbd> Neustart</span>
    <span><kbd>N</kbd> Neuer Seed</span>
    <span>Bälle durchdringen sich – wie im Original.</span>
  </footer>
</div>

<script>
(() => {
  'use strict';

  /* =====================================================================
     Prallwerk – 2D-Physikstudio für vertikale Bounce-Clips.
     Weltkoordinaten sind immer 1080 x 1920; die Leinwand wird nur skaliert.
     ===================================================================== */

  const W = 1080, H = 1920;
  const SUB = 4;              // Substeps je Simulationsschritt
  const STEP = 1 / 60;        // fester Zeitschritt (deterministisch)
  const DT = STEP / SUB;
  const CX = 540, CY = 1000;  // Mittelpunkt der Form
  const TAU = Math.PI * 2;

  /* ---------------------------------------------------------------- Parameter */
  const P = {
    shape: 'circle', size: 0.86, spin: 0, wall: 14,
    barrier: 'rings', bCount: 3, bSpeed: 55,
    gravity: 2400, bounce: 1.0, ballSize: 26, startSpeed: 850, ballHit: false, startBalls: 1,
    slide: 1.0, tempo: 1,
    split: 'chance', splitChance: 18, maxBalls: 180, shrink: true, spread: 30,
    palette: 'neon', colorMode: 'hit', trail: 55, glow: true, sparks: true,
    shake: true, bg: 'studio',
    hud: true, hudTitle: 'WIE VIELE WERDEN ES?', target: 180,
    melSrc: 'builtin', melPick: 'korobeiniki', scale: 'penta',
    instrument: 'marimba', melTrigger: 'all', melRate: 7, volume: 55,
    warp: false, noteLen: 0.5,
    editSize: 70, snap: false, wallShow: true,
    fight: false, fightCount: 2,
    rhythm: 'off', bpm: 120, songStart: 0, songVol: 80,
    songMode: 'unlock', burstLen: 0.28, songTrigger: 'all', unlockAt: 60,
    ballRoll: true,
    beatPulse: true, beatColor: true, beatSplit: false, beatSpin: false, beatLock: false,
    outRes: 720, bitrate: 4, recLimit: 15,
  };

  /* ---------------------------------------------------------------- Paletten */
  const PALETTES = {
    neon:   ['#22d3ee', '#a855f7', '#f472b6', '#facc15', '#4ade80', '#fb7185'],
    candy:  ['#ff8fab', '#ffb3c6', '#ffd166', '#8bd3dd', '#c8b6ff', '#ffe066'],
    sunset: ['#ff9e00', '#ff6d00', '#ff4d6d', '#c9184a', '#7b2cbf', '#ffd60a'],
    ice:    ['#e0fbfc', '#98c1d9', '#3d5a80', '#8ecae6', '#48cae4', '#caf0f8'],
    lava:   ['#ffba08', '#faa307', '#f48c06', '#e85d04', '#dc2f02', '#9d0208'],
    brass:  ['#e8a33d', '#f0c26b', '#c98a2e', '#f5e1b4', '#a86f22', '#ffd89b'],
  };

  /* ---------------------------------------------------------------- Zufall */
  let seed = 1234, rnd = mulberry(seed);
  function mulberry(a) {
    return () => {
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const rrange = (lo, hi) => lo + rnd() * (hi - lo);

  /* ---------------------------------------------------------------- Formen
     Jede Form ist ein geschlossenes Polygon aus Einheitsvektoren (Radius 1)
     oder – beim Kreis – exakte Analytik ohne Facetten. */
  function reg(n, rot = 0) {
    const v = [];
    for (let i = 0; i < n; i++) {
      const a = rot + (i / n) * TAU;
      v.push({ x: Math.cos(a), y: Math.sin(a) });
    }
    return v;
  }
  function star(n, inner, rot = -Math.PI / 2) {
    const v = [];
    for (let i = 0; i < n * 2; i++) {
      const a = rot + (i / (n * 2)) * TAU;
      const r = i % 2 ? inner : 1;
      v.push({ x: Math.cos(a) * r, y: Math.sin(a) * r });
    }
    return v;
  }
  function superell(p, steps = 56) {
    const v = [];
    for (let i = 0; i < steps; i++) {
      const a = (i / steps) * TAU, c = Math.cos(a), s = Math.sin(a), e = 2 / p;
      v.push({ x: Math.sign(c) * Math.abs(c) ** e, y: Math.sign(s) * Math.abs(s) ** e });
    }
    return v;
  }
  function heart(steps = 56) {
    const v = [];
    for (let i = 0; i < steps; i++) {
      const t = (i / steps) * TAU;
      const x = 16 * Math.sin(t) ** 3;
      const y = -(13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t));
      v.push({ x: x / 17, y: y / 17 });
    }
    return v;
  }
  /** Kapsel: zwei Halbkreiskappen (Radius a) um (0, ±(1-a)), dazwischen Geraden. */
  function stadium(steps = 40) {
    const v = [], a = 0.6, off = 1 - a, half = steps / 2;
    for (let i = 0; i <= half; i++) {
      const t = (i / half) * Math.PI;
      v.push({ x: Math.cos(t) * a, y: off + Math.sin(t) * a });
    }
    for (let i = 0; i <= half; i++) {
      const t = Math.PI + (i / half) * Math.PI;
      v.push({ x: Math.cos(t) * a, y: -off + Math.sin(t) * a });
    }
    return v;
  }

  const SHAPES = {
    circle:  { name: 'Kreis', unit: null },
    // Der Rahmen füllt bei Größe 1,00 genau das ganze 9:16-Bild – die Vorlage
    // für eine selbst gebaute Szene.
    // Der Mittelpunkt liegt bei CY, nicht in der Bildmitte – die Kanten müssen
    // das ausgleichen, damit der Rahmen bei Größe 1,00 genau das Bild füllt.
    frame:   { name: 'Rahmen (ganzes Bild)', unit: [
      { x: 1, y: (H - CY) / (W / 2) }, { x: -1, y: (H - CY) / (W / 2) },
      { x: -1, y: -CY / (W / 2) }, { x: 1, y: -CY / (W / 2) }] },
    squircle:{ name: 'Weiches Quadrat', unit: superell(4) },
    square:  { name: 'Quadrat', unit: reg(4, Math.PI / 4) },
    tri:     { name: 'Dreieck', unit: reg(3, -Math.PI / 2) },
    penta:   { name: 'Fünfeck', unit: reg(5, -Math.PI / 2) },
    hexa:    { name: 'Sechseck', unit: reg(6, -Math.PI / 2) },
    octa:    { name: 'Achteck', unit: reg(8, Math.PI / 8) },
    star5:   { name: 'Stern (5)', unit: star(5, 0.46) },
    star6:   { name: 'Stern (6)', unit: star(6, 0.56) },
    stadium: { name: 'Kapsel', unit: stadium() },
    heart:   { name: 'Herz', unit: heart() },
  };

  /* ---------------------------------------------------------------- Welt */
  const world = {
    kind: 'circle', R: 470, Rbase: 470, angle: 0, om: 0,
    verts: [], norms: [], inR: 470,
    barriers: [], custom: [], balls: [], sparks: [], ripples: [], shots: [], spawn: null,
    winner: null, overAt: 0,
    hits: 0, time: 0, flash: 0, shake: 0, running: true,
    pulse: 0, beats: 0, beatT: 0,
  };

  function buildShape() {
    const def = SHAPES[P.shape] || SHAPES.circle;
    world.Rbase = 0.5 * W * P.size;
    world.R = world.Rbase;
    world.pulse = 0;
    world.om = (P.spin * Math.PI) / 180;
    world.kind = def.unit ? 'poly' : 'circle';
    world.unit = def.unit;
    updateShape();
    world.inR = world.kind === 'circle' ? world.R : minEdgeDist();
  }

  /** Dreht die Einheitspunkte auf die aktuelle Lage und legt Außennormalen an. */
  function updateShape() {
    if (world.kind !== 'poly') return;
    const u = world.unit, n = u.length, R = world.R;
    const ca = Math.cos(world.angle), sa = Math.sin(world.angle);
    const v = world.verts.length === n ? world.verts : (world.verts = Array.from({ length: n }, () => ({ x: 0, y: 0 })));
    for (let i = 0; i < n; i++) {
      v[i].x = CX + (u[i].x * ca - u[i].y * sa) * R;
      v[i].y = CY + (u[i].x * sa + u[i].y * ca) * R;
    }
    const nm = world.norms.length === n ? world.norms : (world.norms = Array.from({ length: n }, () => ({ x: 0, y: 0 })));
    for (let i = 0; i < n; i++) {
      const a = v[i], b = v[(i + 1) % n];
      let nx = b.y - a.y, ny = -(b.x - a.x);
      const l = Math.hypot(nx, ny) || 1;
      nx /= l; ny /= l;
      // Außen ist die Seite, die vom Mittelpunkt wegzeigt.
      if (nx * ((a.x + b.x) / 2 - CX) + ny * ((a.y + b.y) / 2 - CY) < 0) { nx = -nx; ny = -ny; }
      nm[i].x = nx; nm[i].y = ny;
    }
  }

  function minEdgeDist() {
    let m = Infinity;
    const v = world.verts, n = v.length;
    for (let i = 0; i < n; i++) {
      const q = closestOnSeg(CX, CY, v[i], v[(i + 1) % n]);
      m = Math.min(m, Math.hypot(q.x - CX, q.y - CY));
    }
    return m;
  }

  const _q = { x: 0, y: 0, t: 0 };
  function closestOnSeg(px, py, a, b) {
    const dx = b.x - a.x, dy = b.y - a.y;
    const len2 = dx * dx + dy * dy || 1;
    let t = ((px - a.x) * dx + (py - a.y) * dy) / len2;
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    _q.x = a.x + dx * t; _q.y = a.y + dy * t; _q.t = t;
    return _q;
  }

  /** Vorzeichenbehafteter Abstand zur Wand: negativ = innen. */
  function wallDist(px, py) {
    if (world.kind === 'circle') return Math.hypot(px - CX, py - CY) - world.R;
    const v = world.verts, n = v.length;
    let best = Infinity, bi = 0, bx = 0, by = 0;
    for (let i = 0; i < n; i++) {
      const q = closestOnSeg(px, py, v[i], v[(i + 1) % n]);
      const d = (px - q.x) ** 2 + (py - q.y) ** 2;
      if (d < best) { best = d; bi = i; bx = q.x; by = q.y; }
    }
    const nm = world.norms[bi];
    const side = (px - bx) * nm.x + (py - by) * nm.y;
    return side >= 0 ? Math.sqrt(best) : -Math.sqrt(best);
  }
  const insideBy = (x, y, m) => wallDist(x, y) < -m;

  /* ---------------------------------------------------------------- Barrieren */
  const BARRIERS = {
    none:    'Keine',
    rings:   'Ringe mit Lücke',
    pegs:    'Pegs (Plinko)',
    bars:    'Rotierende Balken',
    spinner: 'Kreuz-Spinner',
    zigzag:  'Zickzack',
    orbit:   'Orbit-Kugeln',
    mix:     'Kombi',
  };

  /** Freie Breite der Form auf Höhe y (mit Sicherheitsabstand für den Ball). */
  function chord(y) {
    const m = P.ballSize + 18;
    let half = 0;
    for (let x = 8; x < W / 2; x += 8) {
      if (insideBy(CX + x, y, m) && insideBy(CX - x, y, m)) half = x; else break;
    }
    return half * 2;
  }

  function buildBarriers() {
    const B = world.barriers = [];
    const inR = world.inR;
    const om = (P.bSpeed * Math.PI) / 180;
    const n = Math.max(1, P.bCount | 0);
    const add = (o) => B.push(o);

    switch (P.barrier) {
      case 'rings':
        for (let i = 0; i < n; i++) {
          const r = (inR * (i + 1)) / (n + 1);
          if (r < P.ballSize * 1.7) continue;
          add({ t: 'arc', r, h: 10, span: TAU - 0.95 - i * 0.1, a: i * 1.7, om: om * (i % 2 ? -1 : 0.8) });
        }
        break;

      case 'pegs': {
        const rows = n + 2, pr = 15, gap = 118;
        for (let ry = 0; ry < rows; ry++) {
          const y = CY - inR * 0.72 + (ry / Math.max(1, rows - 1)) * inR * 1.44;
          for (let c = -4; c <= 4; c++) {
            const x = CX + c * gap + (ry % 2 ? gap / 2 : 0);
            if (insideBy(x, y, pr + P.ballSize + 12)) add({ t: 'peg', x, y, r: pr, om: 0 });
          }
        }
        break;
      }

      case 'bars':
        for (let i = 0; i < n; i++) {
          const y = CY + inR * (n === 1 ? 0 : -0.6 + (1.2 * i) / (n - 1));
          const len = chord(y) * 0.78;
          if (len > 90) add({ t: 'bar', cx: CX, cy: y, len, h: 11, a: i * 0.7, om: om * (i % 2 ? -1 : 1) });
        }
        break;

      case 'spinner':
        for (let i = 0; i < Math.max(2, n); i++) {
          add({ t: 'bar', cx: CX, cy: CY, len: inR * 1.45, h: 12, a: (i * Math.PI) / Math.max(2, n), om });
        }
        break;

      case 'zigzag':
        for (let i = 0; i <= n; i++) {
          const y = CY - inR * 0.7 + (i / Math.max(1, n)) * inR * 1.4;
          const w = chord(y);
          const len = w * 0.62;
          if (len < 90) continue;
          const dir = i % 2 ? 1 : -1;
          add({ t: 'bar', cx: CX + dir * w * 0.16, cy: y, len, h: 10, a: dir * 0.3, om: 0 });
        }
        break;

      case 'orbit': {
        const k = Math.max(2, n + 1), orbitR = inR * 0.62;
        for (let i = 0; i < k; i++) {
          add({ t: 'peg', x: CX, y: CY, r: 30, om, orbitR, phase: (i * TAU) / k });
        }
        break;
      }

      case 'mix':
        add({ t: 'arc', r: inR * 0.8, h: 10, span: TAU - 1.1, a: 0, om });
        add({ t: 'arc', r: inR * 0.52, h: 10, span: TAU - 1.1, a: 2, om: -om * 0.8 });
        for (let i = 0; i < 2; i++) {
          add({ t: 'bar', cx: CX, cy: CY, len: inR * 0.6, h: 12, a: (i * Math.PI) / 2, om: om * 1.5 });
        }
        break;
    }
    // Orbit-Pegs sofort auf ihre Bahn setzen.
    updateBarriers(0);
  }

  function updateBarriers(dt) {
    for (const o of world.barriers) dreheHindernis(o, dt);
    for (const o of world.custom) dreheHindernis(o, dt);
  }

  function dreheHindernis(o, dt) {
    {
      if (!o.om) return;
      if (o.orbitR !== undefined) {
        o.phase += o.om * dt;
        o.x = CX + Math.cos(o.phase) * o.orbitR;
        o.y = CY + Math.sin(o.phase) * o.orbitR;
      } else {
        o.a += o.om * dt;
      }
    }
  }

  /* ---------------------------------------------------------------- Bälle */
  function spawn(x, y, vx, vy, r, ci, hue, li) {
    // li ist der feste Bildplatz dieses Balls – er ändert sich nie und wird
    // beim Teilen an das Kind vererbt.
    return { x, y, vx, vy, r, ci, hue, li: li || 0, hits: 0, cool: 0, rot: 0 };
  }

  /* ---------------------------------------------------------------- Kampf
     Jeder Kämpfer ist ein Ball mit Leben und einer Fähigkeit. Nur Treffer
     durch diese Fähigkeit tun weh – ein normaler Zusammenstoß schubst bloß. */
  const ABILITIES = {
    blade:  { name: 'Klinge',   info: 'Eine kreisende Klinge trifft, wen sie streift.' },
    spike:  { name: 'Stachel',  info: 'Lädt sich auf; die nächste Berührung verletzt.' },
    shot:   { name: 'Geschoss', info: 'Feuert auf den nächsten Gegner.' },
    aura:   { name: 'Aura',     info: 'Pulst Schaden im Umkreis.' },
    shield: { name: 'Schild',   info: 'Blockt eine Weile und wirft die Hälfte zurück.' },
  };
  const FIGHT_COLORS = ['#ff4d5e', '#3aa8ff', '#4ade80', '#facc15', '#c084fc', '#fb923c'];
  const FIGHT_START = ['blade', 'shot', 'spike', 'aura', 'shield', 'blade'];

  const fighters = [];
  for (let i = 0; i < 6; i++) {
    fighters.push({
      name: 'Kämpfer ' + (i + 1),
      ability: FIGHT_START[i],
      hp: 100, dmg: 10, rate: 1.2,
      color: FIGHT_COLORS[i],
      src: null, look: null,
    });
  }
  const kaempferZahl = () => Math.max(2, Math.min(6, P.fightCount | 0));

  function nearestEnemy(b) {
    let best = null, bd = Infinity;
    for (const v of world.balls) {
      if (v === b || v.fi === b.fi || v.hp <= 0) continue;
      const d = (v.x - b.x) ** 2 + (v.y - b.y) ** 2;
      if (d < bd) { bd = d; best = v; }
    }
    return best;
  }
  const ballOf = (fi) => world.balls.find((b) => b.fi === fi && b.hp > 0) || null;

  function hurt(v, menge, angreifer) {
    if (!v || v.hp <= 0 || v.inv > 0) return;
    if (v.shieldUntil > world.time) {
      v.inv = 0.25;
      addSparks(v.x, v.y, '#9ad8ff');
      if (angreifer) hurt(angreifer, menge * 0.5, null);   // die Hälfte zurück
      return;
    }
    v.hp -= menge;
    v.inv = 0.3;
    world.flash = 1;
    if (P.shake) world.shake = Math.min(1, world.shake + 0.5);
    addSparks(v.x, v.y, '#ff6b6b');
    addSparks(v.x, v.y, colorOf(v));
    if (v.hp <= 0) {
      v.hp = 0;
      for (let i = 0; i < 6; i++) addSparks(v.x, v.y, colorOf(v));
      const i = world.balls.indexOf(v);
      if (i >= 0) world.balls.splice(i, 1);
    }
  }

  function bladeEnds(b, f) {
    const ang = world.time * (TAU / Math.max(0.3, f.rate)) + b.fi * 1.7;
    const len = b.r * 2.4;
    return {
      ax: b.x - Math.cos(ang) * len * 0.3, ay: b.y - Math.sin(ang) * len * 0.3,
      bx: b.x + Math.cos(ang) * len, by: b.y + Math.sin(ang) * len,
    };
  }

  function fireShot(b, f) {
    const ziel = nearestEnemy(b);
    if (!ziel) return;
    const dx = ziel.x - b.x, dy = ziel.y - b.y;
    const d = Math.hypot(dx, dy) || 1;
    world.shots.push({
      x: b.x + (dx / d) * (b.r + 14), y: b.y + (dy / d) * (b.r + 14),
      vx: (dx / d) * 1100, vy: (dy / d) * 1100,
      r: 10, fi: b.fi, dmg: f.dmg, life: 3, color: f.color,
    });
  }

  function pulseAura(b, f) {
    const R = b.r * 3.4;
    world.ripples.push({ x: b.x, y: b.y, life: 1, max: R, color: f.color });
    for (const v of world.balls) {
      if (v.fi === b.fi || v.hp <= 0) continue;
      if (Math.hypot(v.x - b.x, v.y - b.y) < R + v.r) hurt(v, f.dmg, b);
    }
  }

  /** Der Stachel wirkt beim Zusammenstoß – dort, wo sich die Bälle berühren. */
  function fightContact(a, b) {
    if (!P.fight || a.fi === undefined || b.fi === undefined || a.fi === b.fi) return;
    for (const [x, y] of [[a, b], [b, a]]) {
      const f = fighters[x.fi];
      if (f && f.ability === 'spike' && x.charged) { x.charged = false; hurt(y, f.dmg, x); }
    }
  }

  function fightStep(dt) {
    if (!P.fight) return;
    for (const b of world.balls) {
      if (b.fi === undefined) continue;
      if (b.inv > 0) b.inv -= dt;
      const f = fighters[b.fi];
      if (!f) continue;
      b.cd -= dt;
      if (b.cd <= 0) {
        b.cd = Math.max(0.25, f.rate);
        if (f.ability === 'spike') b.charged = true;
        else if (f.ability === 'shield') b.shieldUntil = world.time + Math.min(1.4, f.rate * 0.6);
        else if (f.ability === 'shot') fireShot(b, f);
        else if (f.ability === 'aura') pulseAura(b, f);
      }
      if (f.ability === 'blade') {
        const e = bladeEnds(b, f);
        A.x = e.ax; A.y = e.ay; Bp.x = e.bx; Bp.y = e.by;
        for (const v of world.balls) {
          if (v === b || v.fi === b.fi || v.hp <= 0 || v.inv > 0) continue;
          const q = closestOnSeg(v.x, v.y, A, Bp);
          if (Math.hypot(v.x - q.x, v.y - q.y) < v.r + 10) hurt(v, f.dmg, b);
        }
      }
    }

    const sh = world.shots;
    for (let i = sh.length - 1; i >= 0; i--) {
      const s = sh[i];
      s.life -= dt;
      s.x += s.vx * dt;
      s.y += s.vy * dt;
      let weg = s.life <= 0 || wallDist(s.x, s.y) > -2;
      if (!weg) {
        for (const v of world.balls) {
          if (v.fi === s.fi || v.hp <= 0) continue;
          if (Math.hypot(v.x - s.x, v.y - s.y) < v.r + s.r) { hurt(v, s.dmg, ballOf(s.fi)); weg = true; break; }
        }
      }
      if (weg) sh.splice(i, 1);
    }

    if (world.winner === null) {
      const leben = new Set();
      for (const b of world.balls) if (b.hp > 0) leben.add(b.fi);
      if (leben.size <= 1) {
        world.winner = leben.size ? [...leben][0] : -1;
        world.overAt = world.time;
      }
    }
  }

  function colorOf(b) {
    if (P.fight && b.fi !== undefined && fighters[b.fi]) return fighters[b.fi].color;
    const pal = PALETTES[P.palette] || PALETTES.neon;
    if (P.colorMode === 'flow') {
      const h = Math.round(((world.time * 70 + b.hue) % 360) / 12) * 12;
      return 'hsl(' + h + ' 92% 62%)';
    }
    return pal[Math.abs(b.ci) % pal.length];
  }

  function reset() {
    rnd = mulberry(seed);
    buildShape();
    buildBarriers();
    world.balls.length = 0;
    world.sparks.length = 0;
    world.ripples.length = 0;
    world.hits = 0; world.time = 0; world.flash = 0; world.shake = 0; world.angle = 0;
    if (world.kind === 'poly') updateShape();
    world.shots.length = 0;
    world.winner = null;
    world.overAt = 0;
    if (P.fight) {
      const k = kaempferZahl();
      for (let i = 0; i < k; i++) {
        const w = (i / k) * TAU - Math.PI / 2;
        const a = rnd() * TAU;
        const f = fighters[i];
        const b = spawn(
          CX + Math.cos(w) * world.inR * 0.6, CY + Math.sin(w) * world.inR * 0.6,
          Math.cos(a) * P.startSpeed, Math.sin(a) * P.startSpeed,
          Math.max(34, P.ballSize), i, rnd() * 360, i,   // im Kampf darf es größer sein
        );
        b.fi = i;
        b.hpMax = Math.max(10, f.hp);
        b.hp = b.hpMax;
        b.cd = f.rate * (0.4 + 0.2 * i);
        b.inv = 0;
        b.charged = false;
        b.shieldUntil = -1;
        b.look = f.look;
        world.balls.push(b);
      }
    } else {
      const n = Math.max(1, Math.min(30, P.startBalls | 0));
      // Mehrere Startbälle stehen nebeneinander, jeder mit eigener Richtung und
      // eigener Farbe – sonst sähen sie aus wie einer.
      const breite = Math.min(world.inR * 1.3, n * P.ballSize * 2.8);
      for (let i = 0; i < n; i++) {
        const a = -Math.PI / 2 + rrange(-0.75, 0.75);
        const versatz = n === 1 ? 0 : (i / (n - 1) - 0.5) * breite;
        const sx = world.spawn ? world.spawn.x : CX;
        const sy = world.spawn ? world.spawn.y : CY - world.inR * 0.45;
        world.balls.push(spawn(
          sx + versatz + rrange(-12, 12), sy + rrange(-30, 30),
          Math.cos(a) * P.startSpeed, Math.sin(a) * P.startSpeed,
          P.ballSize, i, rnd() * 360, i,
        ));
      }
    }
    lastBeat = null;
    world.beats = 0;
    mel.pos = -1;
    mel.last = 0;
    warp = 1;
    warpCount = 0;
    if (songBereit()) {
      stopSong();
      songPos = P.songStart;
      burstUntil = 0;
      unlocked = false;
      lastRestart = 0;
      if (world.running && P.songMode === 'loop') startSong(songPos);
    }
    paintBackground();
    updateReadout();
  }

  /* ---------------------------------------------------------------- Physik */
  const A = { x: 0, y: 0 }, Bp = { x: 0, y: 0 };
  const MAXV = 4200;

  function substep(dt) {
    substepPhysics(dt, world.balls);
    fightStep(dt);
    world.time += dt;
    if (world.flash > 0) world.flash = Math.max(0, world.flash - dt * 4.5);
    if (world.shake > 0) world.shake = Math.max(0, world.shake - dt * 3.2);
    stepEffects(dt);
  }

  /* --- Bälle untereinander ------------------------------------------------
     Bei dreihundert Bällen wäre jeder gegen jeden zu teuer, darum ein Raster:
     Jeder Ball landet in einer Zelle, geprüft wird nur die eigene und die acht
     angrenzenden. Die Listen liegen in wiederverwendeten Int32Arrays, damit
     pro Substep nichts neu angelegt wird. */
  let gridHead = null, gridNext = null;

  function ballCollisions(balls) {
    const n = balls.length;
    if (n < 2) return;
    let maxR = 0;
    for (let i = 0; i < n; i++) if (balls[i].r > maxR) maxR = balls[i].r;
    const cell = Math.max(24, maxR * 2);
    const cols = Math.ceil(W / cell) + 2, rows = Math.ceil(H / cell) + 2;
    const cells = cols * rows;

    if (!gridHead || gridHead.length < cells) gridHead = new Int32Array(cells);
    gridHead.fill(-1, 0, cells);
    if (!gridNext || gridNext.length < n) gridNext = new Int32Array(n * 2);

    const cellOf = (b) => {
      const cx = Math.min(cols - 1, Math.max(0, ((b.x / cell) | 0) + 1));
      const cy = Math.min(rows - 1, Math.max(0, ((b.y / cell) | 0) + 1));
      return cy * cols + cx;
    };
    for (let i = 0; i < n; i++) {
      const k = cellOf(balls[i]);
      gridNext[i] = gridHead[k];
      gridHead[k] = i;
    }

    // Zwischen Bällen bleibt die Sprungkraft bei höchstens 1: Über 1 würde
    // sich die Energie über hunderte Stöße aufschaukeln.
    const e = Math.min(1, P.bounce);
    for (let i = 0; i < n; i++) {
      const a = balls[i];
      const cx = Math.min(cols - 1, Math.max(0, ((a.x / cell) | 0) + 1));
      const cy = Math.min(rows - 1, Math.max(0, ((a.y / cell) | 0) + 1));
      for (let oy = -1; oy <= 1; oy++) {
        const y = cy + oy;
        if (y < 0 || y >= rows) continue;
        for (let ox = -1; ox <= 1; ox++) {
          const x = cx + ox;
          if (x < 0 || x >= cols) continue;
          for (let j = gridHead[y * cols + x]; j !== -1; j = gridNext[j]) {
            if (j <= i) continue;
            resolvePair(a, balls[j], e);
          }
        }
      }
    }
  }

  function resolvePair(a, b, e) {
    const dx = b.x - a.x, dy = b.y - a.y;
    const rr = a.r + b.r;
    const d2 = dx * dx + dy * dy;
    if (d2 >= rr * rr || d2 < 1e-9) return;
    const d = Math.sqrt(d2);
    const nx = dx / d, ny = dy / d;

    // Masse nach Fläche: große Bälle lassen sich weniger schubsen.
    const ma = a.r * a.r, mb = b.r * b.r, ms = ma + mb;
    const raus = Math.min(rr - d, rr * 0.5) * 0.5;   // gemächlich entwirren
    a.x -= nx * raus * (mb / ms); a.y -= ny * raus * (mb / ms);
    b.x += nx * raus * (ma / ms); b.y += ny * raus * (ma / ms);

    const rvn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
    if (rvn >= 0) return;                            // entfernen sich schon
    const j = (-(1 + e) * rvn) / (1 / ma + 1 / mb);
    a.vx -= (j * nx) / ma; a.vy -= (j * ny) / ma;
    b.vx += (j * nx) / mb; b.vy += (j * ny) / mb;

    if (predicting) { predictHit = true; return; }
    fightContact(a, b);
    // Beide wechseln die Farbe, geklungen wird aber nur einmal.
    b.hits++;
    if (P.colorMode === 'hit') b.ci++;
    onHit(a, a.x + nx * a.r, a.y + ny * a.r, 'ball');
  }

  /** Nur Bewegung und Stöße – ohne Effekte und Uhr, damit die Vorhersage für
      die Zeitdehnung denselben Code benutzen kann. */
  function substepPhysics(dt, balls) {
    // Der Taktpuls weitet die Wand kurz – die Kollision nutzt denselben Radius,
    // die Form atmet also wirklich, statt nur heller zu leuchten.
    if (world.pulse > 0) world.pulse = Math.max(0, world.pulse - dt * 3.6);
    const R = world.Rbase * (1 + 0.045 * world.pulse);
    if (world.om || Math.abs(R - world.R) > 0.05) {
      world.angle += world.om * dt;
      world.R = R;
      updateShape();
    }
    updateBarriers(dt);
    // Erst die Bälle entwirren, dann bewegen: So holt die Wandprüfung im
    // selben Schritt zurück, was ein Stoß nach außen geschoben hat.
    if (P.ballHit) ballCollisions(balls);
    const g = P.gravity;
    for (let i = 0; i < balls.length; i++) {
      const b = balls[i];
      b.vy += g * dt;
      const sp = Math.hypot(b.vx, b.vy);
      if (sp > MAXV) { b.vx = (b.vx / sp) * MAXV; b.vy = (b.vy / sp) * MAXV; }
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.rot = (b.rot || 0) + (b.vx / Math.max(6, b.r)) * dt;
      if (b.cool > 0) b.cool -= dt;
      collideWall(b);
      collideBarriers(b);
    }
  }

  /* --- Zeitdehnung -------------------------------------------------------
     Die ehrliche Art, die Physik an die Melodie anzupassen: Die Bahn bleibt
     unangetastet, nur die Uhr läuft schneller oder langsamer, damit der
     nächste Aufschlag genau auf der nächsten Note landet. Dafür wird der
     Taktgeber-Ball vorausberechnet und die Welt danach zurückgestellt. */
  let warp = 1, warpCount = 0, predicting = false, predictHit = false;
  const oneBall = [null], predictHits = [];

  /** Zeiten der nächsten Aufschläge dieses Balls, in Sekunden Simulationszeit. */
  function predictImpacts(b, horizon, max) {
    const bars = world.barriers.concat(world.custom);
    const save = {
      x: b.x, y: b.y, vx: b.vx, vy: b.vy, r: b.r, cool: b.cool,
      angle: world.angle, R: world.R, pulse: world.pulse,
      a: bars.map((o) => (o.orbitR !== undefined ? o.phase : o.a)),
      px: bars.map((o) => o.x), py: bars.map((o) => o.y),
    };
    oneBall[0] = b;
    predicting = true;
    predictHit = false;
    predictHits.length = 0;
    let t = 0;
    while (t < horizon && predictHits.length < max) {
      substepPhysics(DT, oneBall);
      t += DT;
      if (predictHit) { predictHit = false; predictHits.push(t); }
    }
    predicting = false;

    b.x = save.x; b.y = save.y; b.vx = save.vx; b.vy = save.vy;
    b.r = save.r; b.cool = save.cool;
    world.angle = save.angle; world.R = save.R; world.pulse = save.pulse;
    for (let i = 0; i < bars.length; i++) {
      const o = bars[i];
      if (o.orbitR !== undefined) { o.phase = save.a[i]; o.x = save.px[i]; o.y = save.py[i]; }
      else o.a = save.a[i];
    }
    updateShape();
    return predictHits.slice();
  }

  /* Ein Ball trifft meist viel öfter, als die Melodie Noten hat. Darum wird
     unter den nächsten Aufschlägen der gesucht, der dem Sollabstand am
     nächsten kommt – die Uhr muss dann nur noch leicht nachhelfen, statt die
     Welt in Zeitlupe zu zwingen. Die Aufschläge davor bleiben stumm. */
  function driveWarp(b) {
    const gap = noteGap(mel.pos);
    const hits = predictImpacts(b, Math.max(0.5, Math.min(4, gap * 2.6)), 24);
    if (!hits.length) { warp = 1; warpCount = 0; return; }
    let best = 0, bestErr = Infinity;
    for (let i = 0; i < hits.length; i++) {
      const err = Math.abs(Math.log(Math.max(1e-4, hits[i]) / gap));
      if (err < bestErr) { bestErr = err; best = i; }
    }
    warp = Math.max(0.4, Math.min(2.5, hits[best] / gap));
    warpCount = best;
  }

  /** Prallt den Ball an einer Fläche ab – optional mit Oberflächengeschwindigkeit. */
  function bounce(b, nx, ny, sx, sy) {
    const ux = b.vx - sx, uy = b.vy - sy;
    const vn = ux * nx + uy * ny;
    const tx = -ny, ty = nx;
    const vt = ux * tx + uy * ty;
    const nvn = Math.abs(vn) * P.bounce;   // stets von der Fläche weg
    const nvt = vt * P.slide;
    b.vx = nx * nvn + tx * nvt + sx;
    b.vy = ny * nvn + ty * nvt + sy;
  }

  function collideWall(b) {
    if (world.kind === 'circle') {
      const dx = b.x - CX, dy = b.y - CY;
      const d = Math.hypot(dx, dy) || 1e-6;
      const lim = world.R - b.r;
      if (d <= lim) return;
      const ux = dx / d, uy = dy / d;
      b.x = CX + ux * lim; b.y = CY + uy * lim;
      const sx = -world.om * (b.y - CY), sy = world.om * (b.x - CX);
      bounce(b, -ux, -uy, sx, sy);
      onHit(b, CX + ux * world.R, CY + uy * world.R, 'wall');
      return;
    }
    const v = world.verts, n = v.length;
    let best = Infinity, bi = 0, bx = 0, by = 0;
    for (let i = 0; i < n; i++) {
      const q = closestOnSeg(b.x, b.y, v[i], v[(i + 1) % n]);
      const d = (b.x - q.x) ** 2 + (b.y - q.y) ** 2;
      if (d < best) { best = d; bi = i; bx = q.x; by = q.y; }
    }
    const nm = world.norms[bi];
    const outside = (b.x - bx) * nm.x + (b.y - by) * nm.y >= 0;
    if (!outside && Math.sqrt(best) >= b.r) return;
    const nx = -nm.x, ny = -nm.y;            // Normale zeigt nach innen
    b.x = bx + nx * b.r; b.y = by + ny * b.r;
    const sx = -world.om * (by - CY), sy = world.om * (bx - CX);
    bounce(b, nx, ny, sx, sy);
    onHit(b, bx, by, 'wall');
  }

  function collideBarriers(b) {
    const gen = world.barriers;
    for (let k = 0; k < gen.length; k++) collideObject(b, gen[k]);
    const eigen = world.custom;
    for (let k = 0; k < eigen.length; k++) collideObject(b, eigen[k]);
  }

  function collideObject(b, o) {
    {
      if (o.solid === false) return;             // reine Deko
      if (o.t === 'img') { collideImage(b, o); return; }

      if (o.t === 'peg') {
        const dx = b.x - o.x, dy = b.y - o.y, rr = b.r + o.r;
        const d = Math.hypot(dx, dy);
        if (d >= rr || d < 1e-6) return;
        const nx = dx / d, ny = dy / d;
        b.x = o.x + nx * rr; b.y = o.y + ny * rr;
        const sx = o.orbitR ? -o.om * (o.y - CY) : 0;
        const sy = o.orbitR ? o.om * (o.x - CX) : 0;
        bounce(b, nx, ny, sx, sy);
        onHit(b, o.x + nx * o.r, o.y + ny * o.r, 'barrier');

      } else if (o.t === 'bar') {
        const c = Math.cos(o.a), s = Math.sin(o.a);
        const hx = (c * o.len) / 2, hy = (s * o.len) / 2;
        A.x = o.cx - hx; A.y = o.cy - hy;
        Bp.x = o.cx + hx; Bp.y = o.cy + hy;
        const q = closestOnSeg(b.x, b.y, A, Bp);
        const qx = q.x, qy = q.y;
        let dx = b.x - qx, dy = b.y - qy;
        let d = Math.hypot(dx, dy);
        const rr = b.r + o.h;
        if (d >= rr) return;
        if (d < 1e-6) { dx = -s; dy = c; d = 1; }
        const nx = dx / d, ny = dy / d;
        b.x = qx + nx * rr; b.y = qy + ny * rr;
        const sx = o.om ? -o.om * (qy - o.cy) : 0;
        const sy = o.om ? o.om * (qx - o.cx) : 0;
        bounce(b, nx, ny, sx, sy);
        onHit(b, qx, qy, 'barrier');

      } else {
        // Bogen: radiale Kollision innerhalb der Winkelspanne …
        const dx = b.x - CX, dy = b.y - CY;
        const d = Math.hypot(dx, dy) || 1e-6;
        const rr = b.r + o.h;
        let done = false;
        if (Math.abs(d - o.r) < rr) {
          let th = Math.atan2(dy, dx) - o.a;
          th = ((th % TAU) + TAU) % TAU;
          if (th <= o.span) {
            const out = d > o.r ? 1 : -1;
            const ux = dx / d, uy = dy / d;
            b.x = CX + ux * (o.r + out * rr);
            b.y = CY + uy * (o.r + out * rr);
            bounce(b, ux * out, uy * out, -o.om * (b.y - CY), o.om * (b.x - CX));
            onHit(b, CX + ux * o.r, CY + uy * o.r, 'barrier');
            done = true;
          }
        }
        // … und die beiden Kappen an der Lücke, damit dort nichts durchrutscht.
        if (!done) {
          for (let e = 0; e < 2; e++) {
            const ea = o.a + (e ? o.span : 0);
            const ex = CX + Math.cos(ea) * o.r, ey = CY + Math.sin(ea) * o.r;
            const ddx = b.x - ex, ddy = b.y - ey, rr2 = b.r + o.h;
            const dd = Math.hypot(ddx, ddy);
            if (dd >= rr2 || dd < 1e-6) continue;
            const nx = ddx / dd, ny = ddy / dd;
            b.x = ex + nx * rr2; b.y = ey + ny * rr2;
            bounce(b, nx, ny, -o.om * (ey - CY), o.om * (ex - CX));
            onHit(b, ex, ey, 'barrier');
          }
        }
      }
    }
  }

  /* --- Bilder als Hindernis ----------------------------------------------
     Ein PNG oder GIF kollidiert entlang seiner Alphakante. Beim Laden wird
     daraus ein vorzeichenbehaftetes Abstandsfeld gerechnet (innen negativ,
     außen positiv); die Kollision liest daraus Abstand und Normale ab. Das
     ist genauer als ein Rechteck und billiger als eine Umrisskurve. */
  function chamfer(d, gw, gh) {
    const A = 1, B = 1.41421356;
    const at = (x, y) => (x < 0 || y < 0 || x >= gw || y >= gh ? 1e6 : d[y * gw + x]);
    for (let y = 0; y < gh; y++) {
      for (let x = 0; x < gw; x++) {
        const i = y * gw + x;
        d[i] = Math.min(d[i], at(x - 1, y) + A, at(x, y - 1) + A,
                        at(x - 1, y - 1) + B, at(x + 1, y - 1) + B);
      }
    }
    for (let y = gh - 1; y >= 0; y--) {
      for (let x = gw - 1; x >= 0; x--) {
        const i = y * gw + x;
        d[i] = Math.min(d[i], at(x + 1, y) + A, at(x, y + 1) + A,
                        at(x + 1, y + 1) + B, at(x - 1, y + 1) + B);
      }
    }
  }

  /** Abstandsfeld aus einem Alphakanal. Rasterzellen als Einheit. */
  function maskFromAlpha(alpha, gw, gh, schwelle = 100) {
    const n = gw * gh, INF = 1e6;
    const raus = new Float32Array(n), rein = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      const fest = alpha[i] > schwelle;
      raus[i] = fest ? 0 : INF;
      rein[i] = fest ? INF : 0;
    }
    // Außerhalb des Bildes ist leer – sonst hätte ein randvolles Bild kein Innen.
    for (let x = 0; x < gw; x++) {
      if (rein[x] === INF) rein[x] = 1;
      const u = (gh - 1) * gw + x;
      if (rein[u] === INF) rein[u] = 1;
    }
    for (let y = 0; y < gh; y++) {
      if (rein[y * gw] === INF) rein[y * gw] = 1;
      const r = y * gw + gw - 1;
      if (rein[r] === INF) rein[r] = 1;
    }
    chamfer(raus, gw, gh);
    chamfer(rein, gw, gh);
    const data = new Float32Array(n);
    for (let i = 0; i < n; i++) {
      data[i] = raus[i] > 0 ? Math.min(raus[i], 900) : -Math.min(rein[i], 900);
    }
    return { gw, gh, data };
  }

  /* Animierte GIFs: Ein <img>, das nicht im Dokument hängt, animiert in den
     meisten Browsern nicht – drawImage zeigte dann ewig das erste Bild. Wo es
     den ImageDecoder gibt, zerlegen wir das GIF selbst in Einzelbilder und
     schalten sie nach ihren eigenen Zeiten weiter; sonst hängen wir das Bild
     unsichtbar ins Dokument, damit der Browser es wenigstens selbst
     weiterlaufen lässt. */
  const gifHalter = document.createElement('div');
  gifHalter.style.cssText = 'position:fixed;left:-9999px;top:0;width:1px;height:1px;'
    + 'overflow:hidden;opacity:.01;pointer-events:none';
  if (document.body) document.body.appendChild(gifHalter);

  function dataUrlBytes(src) {
    const roh = atob(src.slice(src.indexOf(',') + 1));
    const out = new Uint8Array(roh.length);
    for (let i = 0; i < roh.length; i++) out[i] = roh.charCodeAt(i);
    return out;
  }

  async function decodeGif(bytes) {
    if (typeof ImageDecoder === 'undefined') return null;
    const dec = new ImageDecoder({ data: bytes, type: 'image/gif' });
    // Erst wenn die Spurdaten da sind, steht die Zahl der Einzelbilder fest.
    if (dec.tracks && dec.tracks.ready) await dec.tracks.ready;
    await dec.completed;
    const spur = dec.tracks && dec.tracks.selectedTrack;
    const n = Math.min(spur ? spur.frameCount : 1, 120);
    if (n < 2) { dec.close(); return null; }
    const frames = [];
    for (let i = 0; i < n; i++) {
      const { image } = await dec.decode({ frameIndex: i });
      const c = document.createElement('canvas');
      c.width = image.displayWidth;
      c.height = image.displayHeight;
      c.getContext('2d').drawImage(image, 0, 0);
      // duration kommt in Mikrosekunden; 0 heißt „so schnell wie möglich“.
      frames.push({ c, dt: Math.max(0.02, (image.duration || 100000) / 1e6) });
      image.close();
    }
    dec.close();
    return frames;
  }

  /** Legt Startzeiten und Gesamtdauer der Einzelbilder ans Objekt. */
  function setFrames(o, frames) {
    o.frames = frames;
    if (!frames || frames.length < 2) return;
    o.cum = [];
    let t = 0;
    for (const f of frames) { o.cum.push(t); t += f.dt; }
    o.gifLen = t;
    o.gifIdx = 0;
  }

  /** Das Einzelbild, das jetzt dran ist. */
  function gifBild(o) {
    const fr = o.frames;
    if (!fr || !fr.length) return o.img;
    if (fr.length < 2) return fr[0].c;
    const t = (performance.now() / 1000) % o.gifLen;
    let i = o.gifIdx || 0;
    if (t < o.cum[i]) i = 0;
    while (i < fr.length - 1 && t >= o.cum[i + 1]) i++;
    o.gifIdx = i;
    return fr[i].c;
  }

  /** Maske über alle Einzelbilder: Was in irgendeinem Bild fest ist, ist fest.
      Damit fliegt kein Ball durch etwas hindurch, das gerade zu sehen ist. */
  function maskFromFrames(frames, maxDim) {
    const w = frames[0].c.width, h = frames[0].c.height;
    const k = maxDim / Math.max(w, h);
    const gw = Math.max(8, Math.round(w * k)), gh = Math.max(8, Math.round(h * k));
    const c = document.createElement('canvas');
    c.width = gw; c.height = gh;
    const g = c.getContext('2d', { willReadFrequently: true });
    const alpha = new Uint8Array(gw * gh);
    for (const f of frames) {
      g.clearRect(0, 0, gw, gh);
      g.drawImage(f.c, 0, 0, gw, gh);
      const px = g.getImageData(0, 0, gw, gh).data;
      for (let i = 0; i < alpha.length; i++) if (px[i * 4 + 3] > alpha[i]) alpha[i] = px[i * 4 + 3];
    }
    return maskFromAlpha(alpha, gw, gh);
  }

  /** Lädt eine Bildquelle und bereitet Einzelbilder und Kollisionsmaske vor. */
  async function prepareImage(src) {
    const img = new Image();
    await new Promise((ok, fehler) => {
      img.onload = ok;
      img.onerror = () => fehler(new Error('Bild nicht lesbar'));
      img.src = src;
    });
    let frames = null;
    if (/^data:image\/gif/i.test(src)) {
      try { frames = await decodeGif(dataUrlBytes(src)); } catch (e) { frames = null; }
      if (!frames) gifHalter.appendChild(img);   // dann animiert es der Browser
    }
    let mask = null;
    try { mask = frames ? maskFromFrames(frames, 96) : maskFromImage(img, 96); } catch (e) { mask = null; }
    return { img, frames, mask };
  }

  function maskFromImage(img, maxDim) {
    const iw = img.naturalWidth || img.width || 1;
    const ih = img.naturalHeight || img.height || 1;
    const k = maxDim / Math.max(iw, ih);
    const gw = Math.max(8, Math.round(iw * k)), gh = Math.max(8, Math.round(ih * k));
    const c = document.createElement('canvas');
    c.width = gw; c.height = gh;
    const g = c.getContext('2d', { willReadFrequently: true });
    g.drawImage(img, 0, 0, gw, gh);
    const px = g.getImageData(0, 0, gw, gh).data;
    const alpha = new Uint8Array(gw * gh);
    for (let i = 0; i < alpha.length; i++) alpha[i] = px[i * 4 + 3];
    return maskFromAlpha(alpha, gw, gh);
  }

  /** Abstand an einem Weltpunkt, in Rasterzellen. Außerhalb wächst er mit. */
  function sampleSdf(o, wx, wy) {
    const m = o.mask;
    const ca = Math.cos(-o.a), sa = Math.sin(-o.a);
    const dx = wx - o.x, dy = wy - o.y;
    const lx = dx * ca - dy * sa, ly = dx * sa + dy * ca;
    const rx = (lx / o.w + 0.5) * m.gw - 0.5;
    const ry = (ly / o.h + 0.5) * m.gh - 0.5;
    const gx = Math.min(m.gw - 1, Math.max(0, rx));
    const gy = Math.min(m.gh - 1, Math.max(0, ry));
    const aussen = Math.hypot(rx - gx, ry - gy);
    const x0 = gx | 0, y0 = gy | 0;
    const x1 = Math.min(m.gw - 1, x0 + 1), y1 = Math.min(m.gh - 1, y0 + 1);
    const fx = gx - x0, fy = gy - y0;
    const d = m.data;
    return aussen + d[y0 * m.gw + x0] * (1 - fx) * (1 - fy) + d[y0 * m.gw + x1] * fx * (1 - fy)
         + d[y1 * m.gw + x0] * (1 - fx) * fy + d[y1 * m.gw + x1] * fx * fy;
  }

  function collideImage(b, o) {
    if (!o.mask) return;
    const rad = Math.hypot(o.w, o.h) * 0.5 + b.r;
    const ax = b.x - o.x, ay = b.y - o.y;
    if (ax * ax + ay * ay > rad * rad) return;
    const s = o.w / o.mask.gw;                     // Weltpixel je Rasterzelle
    const d = sampleSdf(o, b.x, b.y) * s;
    if (d >= b.r) return;
    let nx = sampleSdf(o, b.x + s, b.y) - sampleSdf(o, b.x - s, b.y);
    let ny = sampleSdf(o, b.x, b.y + s) - sampleSdf(o, b.x, b.y - s);
    const l = Math.hypot(nx, ny);
    if (l < 1e-6) return;
    nx /= l; ny /= l;
    b.x += nx * (b.r - d); b.y += ny * (b.r - d);
    const sx = o.om ? -o.om * (b.y - o.y) : 0;
    const sy = o.om ? o.om * (b.x - o.x) : 0;
    bounce(b, nx, ny, sx, sy);
    onHit(b, b.x - nx * b.r, b.y - ny * b.r, 'barrier');
  }

  function onHit(b, x, y, kind) {
    if (predicting) { predictHit = true; return; }
    world.hits++;
    b.hits++;
    if (P.colorMode === 'hit') b.ci++;
    world.flash = 1;
    if (P.shake) world.shake = Math.min(1, world.shake + 0.3);
    if (P.sparks) addSparks(x, y, colorOf(b));
    addRipple(x, y);
    if (P.warp && b === world.balls[0]) {
      // Nur der ausgewählte Aufschlag klingt – die Zwischenschläge nicht.
      if (warpCount > 0) warpCount--;
      else { playNote(b, kind); driveWarp(b); }
    } else {
      playNote(b, kind);
    }
    if (P.songTrigger !== 'split') songHit(b, kind);
    maybeSplit(b, kind);
    // Das Nachziehen aufs Taktraster greift nur bei wenigen Bällen und an der
    // Wand – an rotierenden Barrieren ist die Flugzeit zu unberechenbar.
    if (P.beatLock && kind === 'wall' && world.balls.length <= 12) lockToBeat(b);
  }

  /* Regelt die Ballgeschwindigkeit sanft nach, bis die Aufschläge auf dem
     Taktraster landen: zu spät -> etwas schneller, zu früh -> etwas langsamer. */
  function lockToBeat(b) {
    const bi = beatInfo();
    if (!bi) return;
    let err = (((world.beatT - bi.ph) % bi.per) + bi.per) % bi.per;
    if (err > bi.per / 2) err -= bi.per;
    const f = Math.max(0.8, Math.min(1.24, 1 + (err / bi.per) * 0.8));
    const sp = Math.hypot(b.vx, b.vy) || 1;
    const ns = Math.max(P.startSpeed * 0.35, Math.min(P.startSpeed * 2.6, sp * f));
    const k = ns / sp;
    b.vx *= k; b.vy *= k;
  }

  function maybeSplit(b, kind) {
    if (P.fight) return;                       // im Kampf bleibt es bei den Kämpfern
    if (P.split === 'off' || b.cool > 0) return;
    if (world.balls.length >= P.maxBalls) return;
    if (P.split === 'barrier' && kind !== 'barrier') return;
    if (P.split === 'ball' && kind !== 'ball') return;
    if (P.split !== 'always' && rnd() * 100 >= P.splitChance) return;
    doSplit(b);
  }

  function doSplit(b) {
    const sp = Math.hypot(b.vx, b.vy) || P.startSpeed;
    const ang = Math.atan2(b.vy, b.vx);
    const half = ((P.spread * Math.PI) / 180) / 2;
    const nr = P.shrink ? Math.max(7, b.r * 0.94) : b.r;

    b.r = nr;
    b.cool = 0.06;
    b.vx = Math.cos(ang - half) * sp;
    b.vy = Math.sin(ang - half) * sp;

    const c = spawn(b.x - Math.sin(ang) * nr * 0.9, b.y + Math.cos(ang) * nr * 0.9,
                    Math.cos(ang + half) * sp, Math.sin(ang + half) * sp,
                    nr, P.colorMode === 'hit' ? b.ci : b.ci + 1, (b.hue + 37) % 360, b.li);
    c.cool = 0.06;
    c.hits = b.hits;
    world.balls.push(c);
    if (P.songTrigger === 'split') songHit(b, 'split');
  }

  /* ---------------------------------------------------------------- Effekte */
  function addSparks(x, y, col) {
    if (world.sparks.length > 340) return;
    for (let i = 0; i < 3; i++) {
      const a = Math.random() * TAU, sp = 200 + Math.random() * 520;
      world.sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 1, col });
    }
  }
  function addRipple(x, y) {
    if (world.ripples.length < 36) world.ripples.push({ x, y, life: 1 });
  }
  function stepEffects(dt) {
    const s = world.sparks;
    for (let i = s.length - 1; i >= 0; i--) {
      const p = s[i];
      p.life -= dt * 2.2;
      if (p.life <= 0) { s.splice(i, 1); continue; }
      p.vy += 1200 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    }
    const r = world.ripples;
    for (let i = r.length - 1; i >= 0; i--) {
      r[i].life -= dt * 2.6;
      if (r[i].life <= 0) r.splice(i, 1);
    }
  }

  /* ---------------------------------------------------------------- Zeichnen */
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d', { alpha: false });
  const bgCanvas = document.createElement('canvas');
  const bgc = bgCanvas.getContext('2d');
  let scale = 1;

  function setRes(px) {
    canvas.width = px;
    canvas.height = Math.round((px * 16) / 9);
    bgCanvas.width = canvas.width;
    bgCanvas.height = canvas.height;
    scale = canvas.width / W;
    paintBackground();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(bgCanvas, 0, 0);
  }

  function paintBackground() {
    bgc.setTransform(scale, 0, 0, scale, 0, 0);
    if (P.bg === 'black') {
      bgc.fillStyle = '#05060a';
      bgc.fillRect(0, 0, W, H);
    } else {
      const g = bgc.createRadialGradient(CX, CY, 0, CX, CY, W * 0.98);
      g.addColorStop(0, '#151b2c');
      g.addColorStop(0.55, '#0a0d16');
      g.addColorStop(1, '#05060a');
      bgc.fillStyle = g;
      bgc.fillRect(0, 0, W, H);
      if (P.bg === 'grid') {
        bgc.strokeStyle = 'rgba(120, 150, 190, .08)';
        bgc.lineWidth = 2;
        for (let x = 0; x <= W; x += 90) { bgc.beginPath(); bgc.moveTo(x, 0); bgc.lineTo(x, H); bgc.stroke(); }
        for (let y = 0; y <= H; y += 90) { bgc.beginPath(); bgc.moveTo(0, y); bgc.lineTo(W, y); bgc.stroke(); }
      }
    }
  }

  function withAlpha(col, a) {
    if (col[0] === '#') {
      const n = parseInt(col.slice(1), 16);
      return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
    }
    return col.replace(')', ' / ' + a + ')');
  }

  /* Bälle werden als vorgerenderte Sprites gezeichnet – bei 200 Bällen ist
     shadowBlur pro Frame zu teuer. */
  const SPR = 128, CORE = 40, K = (SPR / 2) / CORE;
  const sprites = new Map();
  function sprite(col) {
    let c = sprites.get(col);
    if (c) return c;
    c = document.createElement('canvas');
    c.width = c.height = SPR;
    const g2 = c.getContext('2d');
    const gr = g2.createRadialGradient(SPR / 2, SPR / 2, 0, SPR / 2, SPR / 2, SPR / 2);
    gr.addColorStop(0, 'rgba(255,255,255,.95)');
    gr.addColorStop(0.22, col);
    gr.addColorStop(0.62, col);
    gr.addColorStop(0.80, withAlpha(col, 0.26));
    gr.addColorStop(1, withAlpha(col, 0));
    g2.fillStyle = gr;
    g2.fillRect(0, 0, SPR, SPR);
    if (sprites.size > 200) sprites.clear();
    sprites.set(col, c);
    return c;
  }

  /* --- Eigene Ballbilder --------------------------------------------------
     Jedes geladene Bild wird einmal kreisrund vorgerendert; die Bälle greifen
     es über ihren Farbindex ab, wechseln sich also durch. Animierte GIFs
     bekommen je Einzelbild eine eigene Scheibe. */
  const ballLooks = [];

  function circleSprite(quelle, size) {
    const c = document.createElement('canvas');
    c.width = c.height = size;
    const g = c.getContext('2d');
    g.beginPath();
    g.arc(size / 2, size / 2, size / 2, 0, TAU);
    g.clip();
    const iw = quelle.width || quelle.naturalWidth || size;
    const ih = quelle.height || quelle.naturalHeight || size;
    const k = Math.max(size / iw, size / ih);        // formatfüllend zuschneiden
    g.drawImage(quelle, (size - iw * k) / 2, (size - ih * k) / 2, iw * k, ih * k);
    return c;
  }

  function addBallLook(vor, src) {
    const look = makeLook(vor, src);
    ballLooks.push(look);
    return look;
  }

  /** Baut ein rundes Ballaussehen, ohne es in die gemeinsame Liste zu legen. */
  function makeLook(vor, src) {
    const look = { src, sprites: [] };
    if (vor.frames && vor.frames.length > 1) {
      setFrames(look, vor.frames.slice(0, 24));
      for (const f of look.frames) look.sprites.push(circleSprite(f.c, 128));
    } else {
      look.sprites.push(circleSprite(vor.img, 128));
    }
    return look;
  }

  function ballSprite(look) {
    if (look.sprites.length < 2) return look.sprites[0];
    gifBild(look);                                   // setzt look.gifIdx
    return look.sprites[look.gifIdx || 0];
  }

  function pathShape() {
    ctx.beginPath();
    if (world.kind === 'circle') { ctx.arc(CX, CY, world.R, 0, TAU); return; }
    const v = world.verts;
    ctx.moveTo(v[0].x, v[0].y);
    for (let i = 1; i < v.length; i++) ctx.lineTo(v[i].x, v[i].y);
    ctx.closePath();
  }

  function draw() {
    const pal = PALETTES[P.palette] || PALETTES.neon;
    const fade = 1 - (P.trail / 100) * 0.88;

    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = fade;
    ctx.drawImage(bgCanvas, 0, 0);
    ctx.globalAlpha = 1;

    let ox = 0, oy = 0;
    if (P.shake && world.shake > 0) {
      const m = world.shake * 11;
      ox = (Math.random() - 0.5) * m;
      oy = (Math.random() - 0.5) * m;
    }
    ctx.setTransform(scale, 0, 0, scale, ox * scale, oy * scale);

    // Form – für selbst gebaute Szenen lässt sie sich verstecken; sie hält
    // die Bälle trotzdem im Bild.
    ctx.lineJoin = 'round';
    if (P.wallShow) {
    pathShape();
    ctx.strokeStyle = withAlpha(pal[0], 0.13 + world.flash * 0.2);
    ctx.lineWidth = P.wall * 2.6;
    ctx.stroke();
    pathShape();
    ctx.strokeStyle = 'rgba(236, 242, 255,' + (0.6 + world.flash * 0.4) + ')';
    ctx.lineWidth = P.wall;
    ctx.stroke();
    }

    // Barrieren und eigene Hindernisse
    ctx.lineCap = 'round';
    for (const o of world.barriers) drawObstacle(o);
    for (const o of world.custom) drawObstacle(o);
    if (editMode) drawEditor();

    // Treffer-Wellen und Funken
    ctx.globalCompositeOperation = 'lighter';
    for (const r of world.ripples) {
      ctx.strokeStyle = r.color ? withAlpha(r.color, r.life * 0.55) : 'rgba(255,255,255,' + r.life * 0.3 + ')';
      ctx.lineWidth = r.color ? 7 : 3;
      ctx.beginPath(); ctx.arc(r.x, r.y, (1 - r.life) * (r.max || 64) + 6, 0, TAU); ctx.stroke();
    }
    for (const p of world.sparks) {
      ctx.fillStyle = withAlpha(p.col, Math.max(0, p.life) * 0.85);
      ctx.beginPath(); ctx.arc(p.x, p.y, 3.5 * p.life + 1, 0, TAU); ctx.fill();
    }

    // Bälle
    const balls = world.balls;
    if (ballLooks.length) {
      if (P.glow && balls.length <= 340) {           // Schein unter dem Bild
        for (let i = 0; i < balls.length; i++) {
          const b = balls[i], d = b.r * 2.4 * K;
          ctx.drawImage(sprite(colorOf(b)), b.x - d / 2, b.y - d / 2, d, d);
        }
      }
      ctx.globalCompositeOperation = 'source-over';
      const rollen = P.ballRoll && balls.length <= 220;
      for (let i = 0; i < balls.length; i++) {
        const b = balls[i];
        const eigen = b.look || ballLooks[Math.abs(b.li || 0) % ballLooks.length];
        const spr = ballSprite(eigen);
        if (!spr) continue;
        const d = b.r * 2;
        if (rollen) {
          ctx.save();
          ctx.translate(b.x, b.y);
          ctx.rotate(b.rot || 0);
          ctx.drawImage(spr, -b.r, -b.r, d, d);
          ctx.restore();
        } else {
          ctx.drawImage(spr, b.x - b.r, b.y - b.r, d, d);
        }
      }
    } else if (P.glow && balls.length <= 340) {
      for (let i = 0; i < balls.length; i++) {
        const b = balls[i], d = b.r * 2 * K;
        ctx.drawImage(sprite(colorOf(b)), b.x - d / 2, b.y - d / 2, d, d);
      }
      ctx.globalCompositeOperation = 'source-over';
    } else {
      ctx.globalCompositeOperation = 'source-over';
      for (let i = 0; i < balls.length; i++) {
        const b = balls[i];
        ctx.fillStyle = colorOf(b);
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, TAU); ctx.fill();
      }
    }

    if (P.fight) drawFight();
    if (P.hud) drawHud(pal);
  }

  function drawFight() {
    ctx.lineCap = 'round';
    for (const b of world.balls) {
      const f = fighters[b.fi];
      if (!f) continue;
      if (f.ability === 'blade') {
        const e = bladeEnds(b, f);
        for (const [breite, farbe] of [[18, 'rgba(0,0,0,.4)'], [10, f.color], [3, '#ffffff']]) {
          ctx.beginPath();
          ctx.moveTo(e.ax, e.ay); ctx.lineTo(e.bx, e.by);
          ctx.lineWidth = breite; ctx.strokeStyle = farbe; ctx.stroke();
        }
      } else if (f.ability === 'spike' && b.charged) {
        ctx.strokeStyle = f.color;
        ctx.lineWidth = 6;
        ctx.beginPath();
        for (let i = 0; i < 10; i++) {
          const a = (i / 10) * TAU + world.time * 2;
          ctx.moveTo(b.x + Math.cos(a) * b.r, b.y + Math.sin(a) * b.r);
          ctx.lineTo(b.x + Math.cos(a) * (b.r + 16), b.y + Math.sin(a) * (b.r + 16));
        }
        ctx.stroke();
      } else if (f.ability === 'shield' && b.shieldUntil > world.time) {
        ctx.strokeStyle = 'rgba(154, 216, 255, .9)';
        ctx.lineWidth = 7;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 13, 0, TAU); ctx.stroke();
      } else if (f.ability === 'aura') {
        const t = 1 - Math.max(0, Math.min(1, b.cd / Math.max(0.25, f.rate)));
        ctx.strokeStyle = withAlpha(f.color, 0.2 + t * 0.45);
        ctx.lineWidth = 5;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 10 + t * 16, 0, TAU); ctx.stroke();
      }
      if (b.inv > 0) {                            // kurz nach einem Treffer blinken
        ctx.strokeStyle = 'rgba(255,255,255,' + Math.max(0, Math.min(1, b.inv * 2)) + ')';
        ctx.lineWidth = 4;
        ctx.beginPath(); ctx.arc(b.x, b.y, b.r + 5, 0, TAU); ctx.stroke();
      }
    }

    for (const s of world.shots) {
      ctx.fillStyle = s.color;
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, TAU); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.85)';
      ctx.beginPath(); ctx.arc(s.x, s.y, s.r * 0.45, 0, TAU); ctx.fill();
    }

    for (const b of world.balls) {
      if (b.hpMax === undefined) continue;
      const w = Math.max(56, b.r * 2.6), x = b.x - w / 2, y = b.y - b.r - 26;
      const p = Math.max(0, b.hp / b.hpMax);
      ctx.fillStyle = 'rgba(0,0,0,.6)';
      rrect(x - 3, y - 3, w + 6, 16, 8); ctx.fill();
      ctx.fillStyle = fighters[b.fi] ? fighters[b.fi].color : '#ffffff';
      rrect(x, y, Math.max(3, w * p), 10, 5); ctx.fill();
    }
  }

  function drawFightHud() {
    const k = kaempferZahl();
    const x = 80, w = W - 160;
    for (let i = 0; i < k; i++) {
      const f = fighters[i];
      const b = ballOf(i);
      const y = 82 + i * 78;
      const p = b && b.hpMax ? Math.max(0, b.hp / b.hpMax) : 0;

      ctx.textAlign = 'left';
      ctx.font = '600 36px "IBM Plex Sans", system-ui, sans-serif';
      ctx.fillStyle = b ? 'rgba(255,255,255,.92)' : 'rgba(255,255,255,.35)';
      ctx.fillText(f.name.toUpperCase(), x, y - 14);

      ctx.textAlign = 'right';
      ctx.font = '500 30px "IBM Plex Mono", monospace';
      ctx.fillStyle = 'rgba(255,255,255,.55)';
      ctx.fillText(ABILITIES[f.ability].name + '   ' + Math.max(0, Math.ceil(b ? b.hp : 0)), x + w, y - 14);

      ctx.fillStyle = 'rgba(255,255,255,.14)';
      rrect(x, y, w, 20, 10); ctx.fill();
      ctx.fillStyle = f.color;
      rrect(x, y, Math.max(4, w * p), 20, 10); ctx.fill();
    }

    ctx.textAlign = 'center';
    if (world.winner !== null) {
      const txt = world.winner >= 0
        ? fighters[world.winner].name.toUpperCase() + ' GEWINNT'
        : 'UNENTSCHIEDEN';
      ctx.shadowColor = 'rgba(0,0,0,.65)';
      ctx.shadowBlur = 30;
      ctx.font = '92px "Archivo Black", "Arial Black", sans-serif';
      ctx.fillStyle = world.winner >= 0 ? fighters[world.winner].color : '#ffffff';
      ctx.fillText(txt, CX, CY);
      ctx.shadowBlur = 0;
    }
  }

  function drawObstacle(o) {
    if (o.t === 'peg') {
      ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, TAU);
      ctx.fillStyle = '#7d97ac'; ctx.fill();
      ctx.beginPath(); ctx.arc(o.x, o.y, o.r * 0.52, 0, TAU);
      ctx.fillStyle = '#e2eaf1'; ctx.fill();

    } else if (o.t === 'bar') {
      const c = Math.cos(o.a), s = Math.sin(o.a);
      const x1 = o.cx - (c * o.len) / 2, y1 = o.cy - (s * o.len) / 2;
      const x2 = o.cx + (c * o.len) / 2, y2 = o.cy + (s * o.len) / 2;
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
      ctx.lineWidth = o.h * 2; ctx.strokeStyle = '#5f7d95'; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
      ctx.lineWidth = o.h * 0.85; ctx.strokeStyle = '#e2eaf1'; ctx.stroke();

    } else if (o.t === 'img') {
      const bild = gifBild(o);
      if (!bild) return;
      ctx.save();
      ctx.translate(o.x, o.y);
      ctx.rotate(o.a);
      try { ctx.drawImage(bild, -o.w / 2, -o.h / 2, o.w, o.h); } catch (e) { /* noch nicht bereit */ }
      ctx.restore();

    } else {
      ctx.beginPath(); ctx.arc(CX, CY, o.r, o.a, o.a + o.span);
      ctx.lineWidth = o.h * 2; ctx.strokeStyle = '#5f7d95'; ctx.stroke();
      ctx.beginPath(); ctx.arc(CX, CY, o.r, o.a, o.a + o.span);
      ctx.lineWidth = o.h * 0.85; ctx.strokeStyle = '#e2eaf1'; ctx.stroke();
    }
  }

  /** Auswahlrahmen, Fangpunkte und die Vorschau beim Balkenziehen. */
  function drawEditor() {
    ctx.save();
    ctx.setLineDash([12, 10]);
    ctx.lineWidth = 3;
    for (const o of world.custom) {
      ctx.strokeStyle = o === selected ? '#e8a33d' : 'rgba(226, 234, 241, .35)';
      const r = objRadius(o);
      ctx.beginPath();
      ctx.arc(objX(o), objY(o), r + 10, 0, TAU);
      ctx.stroke();
    }
    const sp = world.spawn;
    if (sp) {
      ctx.setLineDash([]);
      ctx.strokeStyle = '#4ade80';
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(sp.x, sp.y, 26, 0, TAU); ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(sp.x - 40, sp.y); ctx.lineTo(sp.x + 40, sp.y);
      ctx.moveTo(sp.x, sp.y - 40); ctx.lineTo(sp.x, sp.y + 40);
      ctx.stroke();
      ctx.setLineDash([12, 10]);
    }
    if (drag && drag.start && drag.now) {
      ctx.strokeStyle = '#e8a33d';
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.moveTo(drag.start.x, drag.start.y);
      ctx.lineTo(drag.now.x, drag.now.y);
      ctx.stroke();
    }
    ctx.restore();
  }

  function rrect(x, y, w, h, r) {
    ctx.beginPath();
    if (ctx.roundRect) ctx.roundRect(x, y, w, h, r);
    else ctx.rect(x, y, w, h);
  }

  function drawHud(pal) {
    ctx.setTransform(scale, 0, 0, scale, 0, 0);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';

    if (P.fight) { drawFightHud(); return; }

    const title = P.hudTitle.trim();
    if (title) {
      ctx.font = '600 44px "IBM Plex Sans", system-ui, sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,.72)';
      ctx.fillText(title.toUpperCase(), CX, 122);
    }

    ctx.shadowColor = 'rgba(0,0,0,.55)';
    ctx.shadowBlur = 26;
    ctx.font = '150px "Archivo Black", "Arial Black", sans-serif';
    ctx.fillStyle = '#ffffff';
    ctx.fillText(String(world.balls.length), CX, 296);
    ctx.shadowBlur = 0;

    ctx.font = '500 28px "IBM Plex Mono", monospace';
    ctx.fillStyle = 'rgba(255,255,255,.45)';
    ctx.fillText('BÄLLE', CX, 344);

    const w = 520, x = CX - w / 2, y = H - 168;
    // Im Anspielmodus ist die Sperre das eigentliche Ziel – das gehört ins Bild.
    const ziel = anspielModus() && !unlocked ? freiAb() : P.target;
    const p = Math.min(1, world.balls.length / Math.max(1, ziel));
    ctx.fillStyle = 'rgba(255,255,255,.14)';
    rrect(x, y, w, 10, 5); ctx.fill();
    ctx.fillStyle = pal[0];
    rrect(x, y, Math.max(10, w * p), 10, 5); ctx.fill();
    ctx.font = '500 26px "IBM Plex Mono", monospace';
    ctx.fillStyle = 'rgba(255,255,255,.5)';
    ctx.fillText((anspielModus() && !unlocked ? 'SONG BEI ' : 'ZIEL ') + ziel
      + '   ·   TREFFER ' + world.hits, CX, y + 46);
  }

  /* ---------------------------------------------------------------- Klang
     Die Bälle spielen die Melodie: Jeder Aufschlag rückt eine Note weiter.
     Notenquelle ist eine Tonleiter, eine eingebaute Melodie oder eine
     MIDI-Datei. Aus einer MP3 lässt sich eine Melodie nicht herauslösen –
     Mehrstimmiges zuverlässig in Noten zurückzurechnen kann heute keine
     Software im Browser. MIDI dagegen ist die Notenschrift selbst. */
  let ac = null, master = null, recDest = null, lastVoice = 0;
  const SCALES = {
    penta: [0, 2, 4, 7, 9],
    minor: [0, 2, 3, 5, 7, 8, 10],
    major: [0, 2, 4, 5, 7, 9, 11],
    blip: [0, 5, 12],
  };

  /* Gemeinfreie Melodien, als MIDI-Notennummern. */
  const MELODIES = {
    korobeiniki: { name: 'Korobeiniki', notes: [
      76, 71, 72, 74, 72, 71, 69, 69, 72, 76, 74, 72, 71, 72, 74, 76, 72, 69, 69,
      74, 77, 81, 79, 77, 76, 72, 76, 74, 72, 71, 71, 72, 74, 76, 72, 69, 69] },
    elise: { name: 'Für Elise', notes: [
      76, 75, 76, 75, 76, 71, 74, 72, 69, 60, 64, 69, 71, 64, 68, 71, 72, 64,
      76, 75, 76, 75, 76, 71, 74, 72, 69, 60, 64, 69, 71, 64, 72, 71, 69] },
    ode: { name: 'Ode an die Freude', notes: [
      64, 64, 65, 67, 67, 65, 64, 62, 60, 60, 62, 64, 64, 62, 62,
      64, 64, 65, 67, 67, 65, 64, 62, 60, 60, 62, 64, 62, 60, 60] },
    bergkoenig: { name: 'In der Halle des Bergkönigs', notes: [
      59, 61, 62, 64, 62, 61, 59, 55, 59, 55, 59, 61, 62, 64, 62, 61,
      59, 55, 59, 55, 62, 64, 66, 67, 66, 64, 62, 59, 62, 59, 62, 64] },
    carol: { name: 'Carol of the Bells', notes: [
      69, 68, 69, 65, 69, 68, 69, 65, 69, 68, 69, 65, 69, 68, 69, 65,
      72, 69, 72, 69, 72, 71, 72, 69, 69, 68, 69, 65] },
    entchen: { name: 'Alle meine Entchen', notes: [
      60, 62, 64, 65, 67, 67, 69, 69, 69, 69, 67, 69, 69, 69, 69, 67,
      65, 65, 65, 65, 64, 64, 62, 62, 62, 62, 60] },
  };

  const mel = { notes: [], times: null, name: '', pos: -1, last: 0 };
  let midiNotes = [], midiTimes = null, midiName = '';

  /** Sollzeit zwischen Note idx und der nächsten – aus der MIDI-Datei, sonst
      aus dem eingestellten Notenwert. */
  function noteGap(idx) {
    const t = mel.times;
    if (t && idx >= 0 && idx + 1 < t.length) {
      return Math.max(0.07, Math.min(1.6, t[idx + 1] - t[idx]));
    }
    return Math.max(0.07, Math.min(1.6, (60 / Math.max(30, P.bpm)) * P.noteLen));
  }

  function scaleNotes() {
    const sc = SCALES[P.scale] || SCALES.penta;
    const out = [];
    for (let o = 0; o < 3; o++) for (const n of sc) out.push(55 + n + 12 * o);
    return out;
  }

  function refreshMelody() {
    if (P.melSrc === 'builtin') {
      const m = MELODIES[P.melPick] || MELODIES.korobeiniki;
      mel.notes = m.notes; mel.times = null; mel.name = m.name;
    } else if (P.melSrc === 'midi') {
      mel.notes = midiNotes; mel.times = midiTimes; mel.name = midiName || 'MIDI';
    } else if (P.melSrc === 'scale') {
      mel.notes = scaleNotes(); mel.times = null; mel.name = 'Tonleiter';
    } else {
      mel.notes = []; mel.times = null; mel.name = '';
    }
    mel.pos = -1;
    const show = (key, on) => {
      const c = el('c_' + key);
      const row = c && c.closest('.row');
      if (row) row.hidden = !on;
    };
    show('melPick', P.melSrc === 'builtin');
    show('scale', P.melSrc === 'scale');
    show('melTrigger', !P.warp);
    show('melRate', !P.warp);
    show('noteLen', !(P.melSrc === 'midi' && midiTimes));
    const midi = el('midiRow');
    if (midi) midi.hidden = P.melSrc !== 'midi';
    const wn = el('warpNote');
    if (wn) wn.hidden = !P.warp;
    melStatus();
  }

  function melStatus() {
    const n = el('melStatus');
    if (!n) return;
    if (!mel.notes.length) {
      n.textContent = P.melSrc === 'midi'
        ? 'Noch keine MIDI-Datei geladen. MIDI-Dateien zu bekannten Liedern findest du z. B. über „<Titel> midi" in der Suche.'
        : 'Stumm – die Treffer bleiben lautlos.';
      n.classList.remove('on');
      return;
    }
    n.textContent = mel.name + ' · Note ' + (Math.max(0, mel.pos) + 1) + ' von ' + mel.notes.length;
    n.classList.add('on');
  }

  /* --- MIDI lesen ---------------------------------------------------------
     Robust gegen das, was einem im Netz begegnet: RIFF/RMID-Verpackung, Müll
     vor dem Kopf, unbekannte Chunks zwischen den Spuren, Running Status,
