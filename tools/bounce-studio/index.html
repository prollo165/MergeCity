     abgeschnittene Dateien. Aus allen Spuren außer dem Schlagzeugkanal werden
     die Note-Ons gesammelt und je Zeitpunkt der höchste Ton genommen: In fast
     jedem Satz liegt die Melodie in der Oberstimme. Tempowechsel werden
     mitgelesen, damit die Noten ihre echten Zeiten behalten. */
  function parseMidi(bytes) {
    const dv = new DataView(bytes);
    let pos = 0;
    // Alle Lesezugriffe laufen über u8: Eine abgeschnittene oder kaputte Datei
    // soll eine Fehlermeldung ergeben, keinen Absturz.
    const u8 = () => (pos < dv.byteLength ? dv.getUint8(pos++) : (pos++, 0));
    const tag = () => String.fromCharCode(u8(), u8(), u8(), u8());
    const u32 = () => ((u8() << 24) | (u8() << 16) | (u8() << 8) | u8()) >>> 0;
    const u16 = () => (u8() << 8) | u8();
    const varlen = () => {
      let v = 0, b, n = 0;
      do { b = u8(); v = (v << 7) | (b & 0x7f); } while (b & 0x80 && ++n < 4 && pos < dv.byteLength);
      return v;
    };

    // Kopf suchen statt voraussetzen: .rmi-Dateien stecken in einem
    // RIFF-Container, manche Downloads tragen Müll davor.
    let head = -1;
    for (let i = 0; i + 4 <= dv.byteLength && i < 4096; i++) {
      if (dv.getUint8(i) === 0x4d && dv.getUint8(i + 1) === 0x54 &&
          dv.getUint8(i + 2) === 0x68 && dv.getUint8(i + 3) === 0x64) { head = i; break; }
    }
    if (head < 0) throw new Error('Darin steckt keine MIDI-Datei (Kopf „MThd" fehlt).');

    pos = head + 4;
    const hlen = u32();
    const format = u16();
    u16();                                     // Spurenzahl – wir lesen bis Dateiende
    const div = u16();
    pos = head + 8 + Math.max(6, hlen);
    const tpq = div & 0x8000 ? 480 : div || 480;

    const tempos = [];
    const events = [];
    let seqOffset = 0;                         // nur für Format 2: Spuren nacheinander

    while (pos + 8 <= dv.byteLength) {
      const kind = tag();
      const len = u32();
      const end = Math.min(pos + len, dv.byteLength);
      if (kind !== 'MTrk') { pos = end; continue; }   // unbekannter Chunk: überspringen

      let tick = 0, running = 0, maxTick = 0;
      while (pos < end) {
        tick += varlen();
        if (pos >= end) break;
        let status = dv.getUint8(pos);
        if (status & 0x80) { pos++; running = status; } else { status = running; }
        const type = status & 0xf0;
        if (status === 0xff) {
          const meta = u8();
          const mlen = varlen();
          if (meta === 0x51 && mlen === 3) tempos.push({ tick: tick + seqOffset, us: (u8() << 16) | (u8() << 8) | u8() });
          else pos += mlen;
        } else if (status === 0xf0 || status === 0xf7) {
          pos += varlen();
        } else if (type === 0x90 || type === 0x80) {
          const note = u8(), vel = u8();
          if (type === 0x90 && vel > 0 && (status & 0x0f) !== 9) {
            events.push({ tick: tick + seqOffset, note });
            if (tick > maxTick) maxTick = tick;
          }
        } else if (type === 0xa0 || type === 0xb0 || type === 0xe0) { pos += 2; }
        else if (type === 0xc0 || type === 0xd0) { pos += 1; }
        else break;                            // unbekannter Status – Spur abbrechen
      }
      pos = end;
      if (format === 2) seqOffset += maxTick + tpq;
    }
    if (!events.length) throw new Error('Die Datei enthält keine spielbaren Noten (nur Schlagzeug?).');

    // Ticks in Sekunden: Tempowechsel abschnittsweise aufsummieren.
    tempos.sort((a, b) => a.tick - b.tick);
    const marks = [{ tick: 0, sec: 0, us: 500000 }];
    for (const tp of tempos) {
      const last = marks[marks.length - 1];
      const sec = last.sec + ((tp.tick - last.tick) / tpq) * (last.us / 1e6);
      if (tp.tick === last.tick) { last.us = tp.us; continue; }
      marks.push({ tick: tp.tick, sec, us: tp.us });
    }
    let mi = 0;
    const toSec = (t) => {
      while (mi + 1 < marks.length && marks[mi + 1].tick <= t) mi++;
      while (mi > 0 && marks[mi].tick > t) mi--;
      const m = marks[mi];
      return m.sec + ((t - m.tick) / tpq) * (m.us / 1e6);
    };

    events.sort((a, b) => a.tick - b.tick || b.note - a.note);
    const tol = Math.max(1, tpq / 16);
    const notes = [], times = [];
    let curTick = -1e9, curTop = -1;
    const flush = () => { if (curTop >= 0) { notes.push(curTop); times.push(toSec(curTick)); } };
    for (const e of events) {
      if (e.tick - curTick > tol) { flush(); curTick = e.tick; curTop = e.note; }
      else if (e.note > curTop) curTop = e.note;
    }
    flush();

    // Liegt fast alles gleichzeitig (dichte Akkordsätze), lieber jede Note
    // einzeln nehmen als eine Melodie aus drei Tönen zu behaupten.
    if (notes.length < 8 && events.length >= 8) {
      notes.length = 0; times.length = 0;
      mi = 0;
      for (const e of events) { notes.push(e.note); times.push(toSec(e.tick)); }
    }
    if (notes.length < 2) throw new Error('Zu wenige Noten für eine Melodie.');
    return { notes: notes.slice(0, 4000), times: times.slice(0, 4000) };
  }

  async function loadMidi(file) {
    if (!file) return;
    audioResume();
    const n = el('melStatus');
    if (n) { n.textContent = 'Lese ' + file.name + ' …'; n.classList.remove('on'); }
    try {
      const res = parseMidi(await file.arrayBuffer());
      midiNotes = res.notes;
      midiTimes = res.times;
      midiName = file.name.replace(/\.(midi?|rmi|kar)$/i, '');
      P.melSrc = 'midi';
      controls.melSrc();
      refreshMelody();
    } catch (e) {
      // Der Grund hilft mehr als ein pauschales „ging nicht".
      if (n) { n.textContent = e && e.message ? e.message : 'Die Datei ließ sich nicht lesen.'; n.classList.remove('on'); }
    }
  }
  function audioInit() {
    if (ac) return ac;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    ac = new AC();
    master = ac.createGain();
    master.gain.value = 0.9;
    master.connect(ac.destination);
    try { recDest = ac.createMediaStreamDestination(); master.connect(recDest); } catch (e) { recDest = null; }
    return ac;
  }
  function audioResume() {
    audioInit();
    if (ac && ac.state === 'suspended') ac.resume();
  }
  /** Ein Aufschlag rückt die Melodie um eine Note weiter und spielt sie. */
  function playNote(b, kind) {
    if (!ac || ac.state !== 'running' || !mel.notes.length) return;
    const now = ac.currentTime;
    if (P.warp) {
      // Bei Zeitdehnung spielt allein der Taktgeber – er trifft ja auf der Note.
      if (b !== world.balls[0]) return;
    } else {
      if (P.melTrigger === 'wall' && kind !== 'wall') return;
      if (P.melTrigger === 'first' && b !== world.balls[0]) return;
      // Bei hundert Bällen prasseln die Treffer schneller als eine Melodie
      // verträgt – die Notenrate deckelt das, ohne die Physik anzufassen.
      if (now - mel.last < 1 / Math.max(1, P.melRate)) return;
    }
    mel.last = now;
    mel.pos = (mel.pos + 1) % mel.notes.length;
    playTone(mel.notes[mel.pos], now);
  }

  function env(g, now, peak, atk, dec) {
    g.gain.setValueAtTime(0.0001, now);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), now + atk);
    g.gain.exponentialRampToValueAtTime(0.0001, now + atk + dec);
  }

  function playTone(midi, now) {
    const f = 440 * Math.pow(2, (midi - 69) / 12);
    const vol = (P.volume / 100) * 0.2 * (songBereit() ? 0.5 : 1);
    const g = ac.createGain();
    g.connect(master);
    lastVoice = now;

    if (P.instrument === 'glocke') {
      const car = ac.createOscillator(), mod = ac.createOscillator(), mg = ac.createGain();
      car.frequency.value = f;
      mod.frequency.value = f * 3.5;
      mg.gain.value = f * 2.2;
      mod.connect(mg); mg.connect(car.frequency); car.connect(g);
      env(g, now, vol * 0.8, 0.003, 1.5);
      car.start(now); mod.start(now);
      car.stop(now + 1.6); mod.stop(now + 1.6);

    } else if (P.instrument === 'pluck') {
      const o = ac.createOscillator(), lp = ac.createBiquadFilter();
      o.type = 'sawtooth'; o.frequency.value = f;
      lp.type = 'lowpass';
      lp.frequency.setValueAtTime(Math.min(12000, f * 9), now);
      lp.frequency.exponentialRampToValueAtTime(Math.max(220, f * 1.3), now + 0.28);
      o.connect(lp); lp.connect(g);
      env(g, now, vol, 0.002, 0.42);
      o.start(now); o.stop(now + 0.5);

    } else if (P.instrument === 'klavier') {
      const a = ac.createOscillator(), b2 = ac.createOscillator(), bg = ac.createGain();
      a.type = 'triangle'; b2.type = 'triangle';
      a.frequency.value = f; b2.frequency.value = f * 2.004;
      bg.gain.value = 0.32;
      b2.connect(bg); bg.connect(g); a.connect(g);
      env(g, now, vol, 0.004, 1.0);
      a.start(now); b2.start(now);
      a.stop(now + 1.1); b2.stop(now + 1.1);

    } else if (P.instrument === 'blip') {
      const o = ac.createOscillator();
      o.type = 'square'; o.frequency.value = f;
      o.connect(g);
      env(g, now, vol * 0.55, 0.002, 0.14);
      o.start(now); o.stop(now + 0.2);

    } else {                                   // Marimba
      const o = ac.createOscillator(), h = ac.createOscillator(), hg = ac.createGain();
      o.type = 'sine'; o.frequency.value = f;
      h.type = 'sine'; h.frequency.value = f * 4;
      hg.gain.value = 0.16;
      h.connect(hg); hg.connect(g); o.connect(g);
      env(g, now, vol, 0.002, 0.5);
      o.start(now); h.start(now);
      o.stop(now + 0.6); h.stop(now + 0.6);
    }
  }

  /* ---------------------------------------------------------------- Rhythmus
     Zwei Taktquellen: ein reiner BPM-Taktgeber oder eine geladene Audiodatei.
     Die Datei wird im Browser decodiert und analysiert und verlässt das Gerät
     nicht. Streaming-Links (Spotify, Apple Music, YouTube) lassen sich dagegen
     nicht anzapfen: Deren Ton ist DRM-geschützt und für Seitencode weder les-
     noch analysierbar. Darum Datei oder BPM. */
  const song = {
    buffer: null, name: '', label: '', period: 0, phase: 0, bpm: 0,
    src: null, gain: null, startedAt: 0,
  };
  let songPos = 0, lastBeat = null, taps = [];
  let burstUntil = 0;                        // bis wann der laufende Schnipsel klingt
  let unlocked = false, lastRestart = 0;     // für „anspielen bis Ziel“

  const songBereit = () => P.rhythm === 'song' && !!song.buffer;
  const schnipselModus = () => songBereit() && P.songMode === 'burst';
  const anspielModus = () => songBereit() && P.songMode === 'unlock';
  /** Ab wie vielen Bällen der Song durchlaufen darf. */
  const freiAb = () => Math.max(2, P.unlockAt | 0);

  const fmtClock = (sec) =>
    Math.floor(sec / 60) + ':' + String(Math.floor(sec % 60)).padStart(2, '0');

  function beatInfo() {
    if (P.rhythm === 'off') return null;
    if (songBereit() && song.period > 0) {
      // Im Schnipselbetrieb läuft der Song nicht durch – dann taktet die
      // Simulationsuhr mit dem erkannten Tempo der Datei.
      if (P.songMode !== 'loop') return { per: song.period, ph: 0, t: world.time };
      return { per: song.period, ph: song.phase, t: songTime() };
    }
    return { per: 60 / Math.max(30, P.bpm), ph: 0, t: world.time };
  }

  function songTime() {
    return song.src && ac ? ac.currentTime - song.startedAt : songPos;
  }

  function startSong(offset) {
    if (!ac || !song.buffer) return;
    stopSong();
    const src = ac.createBufferSource();
    const g = ac.createGain();
    g.gain.value = P.songVol / 100;
    src.buffer = song.buffer;
    src.connect(g);
    g.connect(master);
    const when = ac.currentTime + 0.04;
    const off = Math.max(0, Math.min(offset, song.buffer.duration - 0.05));
    src.start(when, off);
    src.onended = () => { if (song.src === src) song.src = null; };
    song.src = src; song.gain = g; song.startedAt = when - off;
  }

  function stopSong() {
    if (!song.src) return;
    songPos = songTime();
    const quelle = song.src, g = song.gain;
    try {
      if (g && ac) {
        // Kurz ausblenden: Ein hart abgeschnittener Song knackt.
        const t = ac.currentTime;
        g.gain.cancelScheduledValues(t);
        g.gain.setValueAtTime(g.gain.value, t);
        g.gain.linearRampToValueAtTime(0.0001, t + 0.012);
        quelle.stop(t + 0.03);
      } else {
        quelle.stop();
      }
    } catch (e) { /* war schon zu Ende */ }
    song.src = null;
    song.gain = null;
  }

  /* Der Song läuft nicht im Hintergrund, sondern rückt bei jedem Treffer um
     einen Schnipsel vor – das Stück wird also erst durch die Bälle hörbar.
     Kurze Ein- und Ausblenden verhindern das Knacken an den Schnittkanten. */
  function playBurst(b, kind) {
    if (!ac || ac.state !== 'running' || !schnipselModus()) return;
    if (P.songTrigger === 'wall' && kind !== 'wall') return;
    if (P.songTrigger === 'split' && kind !== 'split') return;
    if (P.songTrigger === 'first' && b !== world.balls[0]) return;

    const now = ac.currentTime;
    if (now < burstUntil - 0.004) return;    // ein Schnipsel nach dem anderen
    const dur = song.buffer.duration;
    const len = Math.max(0.05, Math.min(P.burstLen, dur));
    if (songPos > dur - 0.03) songPos = Math.max(0, Math.min(P.songStart, dur - len));
    const off = Math.max(0, Math.min(songPos, dur - 0.03));

    const src = ac.createBufferSource();
    const g = ac.createGain();
    src.buffer = song.buffer;
    src.connect(g);
    g.connect(master);

    const vol = Math.max(0.0002, P.songVol / 100);
    const fade = Math.min(0.014, len * 0.25);
    g.gain.setValueAtTime(0.0001, now);
    g.gain.linearRampToValueAtTime(vol, now + fade);
    g.gain.setValueAtTime(vol, now + Math.max(fade, len - fade));
    g.gain.linearRampToValueAtTime(0.0001, now + len);
    src.start(now, off, len + 0.03);
    src.stop(now + len + 0.02);

    songPos = off + len;
    burstUntil = now + len;
  }

  /* Anspielen bis Ziel: Jeder Treffer wirft den Song zurück auf den Anfang –
     bis genug Bälle da sind. Dann läuft er ein einziges Mal ganz durch. */
  function playUnlock(b, kind) {
    if (!ac || ac.state !== 'running' || !anspielModus()) return;
    if (P.songTrigger === 'wall' && kind !== 'wall') return;
    if (P.songTrigger === 'split' && kind !== 'split') return;
    if (P.songTrigger === 'first' && b !== world.balls[0]) return;

    if (world.balls.length >= freiAb()) {
      if (!unlocked) { unlocked = true; songPos = P.songStart; startSong(P.songStart); }
      return;                                  // ab jetzt nicht mehr unterbrechen
    }
    const now = ac.currentTime;
    if (now - lastRestart < 0.09) return;      // sonst zerhackt es sich selbst
    lastRestart = now;
    songPos = P.songStart;
    startSong(P.songStart);
  }

  function songHit(b, kind) {
    playBurst(b, kind);
    playUnlock(b, kind);
  }

  function onBeat() {
    world.beats++;
    if (P.beatPulse) { world.pulse = 1; world.flash = Math.max(world.flash, 0.7); }
    if (P.beatColor && P.colorMode !== 'flow') for (const b of world.balls) b.ci++;
    if (P.beatSpin) {
      for (const o of world.barriers) {
        if (!o.om) continue;
        const st = 0.32 * Math.sign(o.om);
        if (o.orbitR !== undefined) o.phase += st; else o.a += st;
      }
      updateBarriers(0);
    }
    if (P.beatSplit && world.balls.length && world.balls.length < P.maxBalls) {
      doSplit(world.balls[(Math.random() * world.balls.length) | 0]);
    }
  }

  /** Prüft je Bild, ob seit dem letzten Bild eine Zählzeit überschritten wurde. */
  function pumpBeats() {
    const bi = beatInfo();
    if (!bi) { lastBeat = null; return; }
    world.beatT = bi.t;
    const idx = Math.floor((bi.t - bi.ph) / bi.per);
    if (lastBeat === null) { lastBeat = idx; return; }
    if (idx > lastBeat) {
      if (idx - lastBeat <= 4) onBeat();   // nach einer Pause nicht nachfeuern
      lastBeat = idx;
    }
  }

  /** Taktschätzung: Bassenergie -> Anstiegsfluss -> Autokorrelation für die
      Periode -> Phasensuche für die Eins. Reicht für alles mit klarer Bassdrum. */
  function analyse(buf) {
    const sr = buf.sampleRate, HOP = 512;
    const a = buf.getChannelData(0);
    const b = buf.numberOfChannels > 1 ? buf.getChannelData(1) : null;
    const frames = Math.floor(a.length / HOP);
    if (frames < 200) return null;

    const env = new Float32Array(frames);
    const k = Math.exp((-2 * Math.PI * 160) / sr);      // Einpol-Tiefpass ~160 Hz
    let lp = 0, i = 0;
    for (let f = 0; f < frames; f++) {
      let sum = 0;
      for (let n = 0; n < HOP; n++, i++) {
        const x = b ? (a[i] + b[i]) * 0.5 : a[i];
        lp = x * (1 - k) + lp * k;
        sum += lp * lp;
      }
      env[f] = Math.sqrt(sum / HOP);
    }
    const flux = new Float32Array(frames);
    for (let f = 1; f < frames; f++) flux[f] = Math.max(0, env[f] - env[f - 1]);

    const fps = sr / HOP;
    const minLag = Math.max(2, Math.round((fps * 60) / 190));
    const maxLag = Math.round((fps * 60) / 60);
    let bestLag = minLag, best = -1;
    for (let lag = minLag; lag <= maxLag; lag++) {
      let sum = 0;
      for (let f = lag; f < frames; f++) sum += flux[f] * flux[f - lag];
      sum /= frames - lag;
      const bpm = (60 * fps) / lag;
      sum *= 1 - Math.min(1, Math.abs(Math.log(bpm / 120)) / 1.2) * 0.35;
      if (sum > best) { best = sum; bestLag = lag; }
    }
    let phase = 0, bestSum = -1;
    for (let p = 0; p < bestLag; p++) {
      let sum = 0;
      for (let f = p; f < frames; f += bestLag) sum += flux[f];
      if (sum > bestSum) { bestSum = sum; phase = p; }
    }
    return { period: bestLag / fps, phase: phase / fps, bpm: (60 * fps) / bestLag };
  }

  function songStatus(text, on) {
    const n = el('songStatus');
    if (!n) return;
    n.textContent = text;
    n.classList.toggle('on', !!on);
  }

  async function loadSong(file) {
    if (!file) return;
    audioResume();
    if (!ac) { songStatus('Dieser Browser kann keine Audiodateien abspielen.'); return; }
    songStatus('Lese ' + file.name + ' …');
    try {
      const raw = await file.arrayBuffer();
      const audio = await ac.decodeAudioData(raw);
      songStatus('Analysiere den Takt …');
      await new Promise((r) => setTimeout(r, 30));
      const res = analyse(audio);
      if (!res) { songStatus('Die Datei ist zu kurz für eine Taktanalyse.'); return; }
      song.buffer = audio; song.name = file.name;
      song.period = res.period; song.phase = res.phase; song.bpm = res.bpm;
      P.rhythm = 'song';
      P.bpm = Math.max(60, Math.min(200, Math.round(res.bpm)));
      controls.rhythm(); controls.bpm();
      refreshRhythm();
      song.label = file.name + ' · ' + Math.round(res.bpm) + ' BPM · ' + fmtClock(audio.duration);
      songStatus(song.label, true);
      reset();
    } catch (e) {
      songStatus('Diese Datei ließ sich nicht lesen. MP3, M4A, WAV oder OGG gehen.');
    }
  }

  function tapTempo() {
    const now = performance.now();
    if (taps.length && now - taps[taps.length - 1] > 2200) taps = [];
    taps.push(now);
    if (taps.length > 5) taps.shift();
    if (taps.length < 2) { songStatus('Weiter tippen …'); return; }
    const span = (taps[taps.length - 1] - taps[0]) / (taps.length - 1);
    P.bpm = Math.max(60, Math.min(200, Math.round(60000 / span)));
    if (P.rhythm === 'off') { P.rhythm = 'bpm'; controls.rhythm(); }
    controls.bpm();
    refreshRhythm();
    lastBeat = null;
    songStatus('Getippt: ' + P.bpm + ' BPM', true);
  }

  function refreshRhythm() {
    const m = el('rhythmMod');
    if (m) m.classList.toggle('muted', P.rhythm === 'off');
    const zeile = (key, an) => {
      const c = el('c_' + key);
      const row = c && c.closest('.row');
      if (row) row.hidden = !an;
    };
    const alsSong = P.rhythm === 'song';
    zeile('songMode', alsSong);
    zeile('burstLen', alsSong && P.songMode === 'burst');
    zeile('unlockAt', alsSong && P.songMode === 'unlock');
    zeile('songTrigger', alsSong && P.songMode !== 'loop');
    zeile('songStart', alsSong);
    zeile('songVol', alsSong);
  }

  /* ---------------------------------------------------------------- Aufnahme */
  let dl = null, recorder = null, recording = false, recStart = 0;
  let chunks = [], recBlob = null, recExt = 'webm', recDur = 0;

  if (window.claude && typeof window.claude.use === 'function') {
    window.claude.use('downloads').then((d) => { dl = d; }).catch(() => { dl = null; });
  }

  const el = (id) => document.getElementById(id);
  const fmtSize = (n) => (n / 1048576).toFixed(1).replace('.', ',') + ' MB';

  function tally(text, live) {
    el('tallyText').textContent = text;
    el('lamp').classList.toggle('live', !!live);
  }

  function startRec() {
    if (recording) return;
    if (!window.MediaRecorder) { exportMsg('Dieser Browser kann nicht aufnehmen – nimm den Bildschirm auf.', true); return; }
    audioResume();
    const cands = ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm', 'video/mp4'];
    const type = cands.find((t) => MediaRecorder.isTypeSupported(t));
    if (!type) { exportMsg('Kein unterstütztes Videoformat gefunden.', true); return; }

    if (editMode) setEdit(false);   // sonst lägen die Hilfsringe im Video
    reset();                        // eine Aufnahme beginnt immer sauber von vorn
    setRunning(true);

    const tracks = canvas.captureStream(60).getVideoTracks();
    if (recDest) tracks.push(...recDest.stream.getAudioTracks());
    try {
      recorder = new MediaRecorder(new MediaStream(tracks), {
        mimeType: type,
        videoBitsPerSecond: P.bitrate * 1e6,
        audioBitsPerSecond: 128000,
      });
    } catch (e) { exportMsg('Aufnahme konnte nicht starten: ' + e.message, true); return; }

    recExt = type.indexOf('mp4') >= 0 ? 'mp4' : 'webm';
    chunks = []; recBlob = null;
    recorder.ondataavailable = (e) => { if (e.data && e.data.size) chunks.push(e.data); };
    recorder.onstop = finishRec;
    recorder.start(400);
    recording = true;
    recStart = performance.now();
    el('btnRec').textContent = 'Stop';
    el('resGroup').querySelectorAll('select').forEach((s) => { s.disabled = true; });
    exportMsg('Läuft …');
    tally('Aufnahme', true);
  }

  function stopRec() {
    if (!recording || !recorder) return;
    recording = false;
    recDur = (performance.now() - recStart) / 1000;
    try { recorder.stop(); } catch (e) { /* bereits gestoppt */ }
    el('btnRec').textContent = 'Aufnahme';
    el('resGroup').querySelectorAll('select').forEach((s) => { s.disabled = false; });
    tally('Bereit', false);
  }

  function finishRec() {
    recBlob = new Blob(chunks, { type: recorder && recorder.mimeType ? recorder.mimeType : 'video/webm' });
    chunks = [];
    el('recSize').textContent = '';
    const over = dl && recBlob.size > 16 * 1024 * 1024;
    exportMsg(
      recDur.toFixed(1).replace('.', ',') + ' s · ' + fmtSize(recBlob.size) + ' · ' + recExt.toUpperCase() +
      (over ? ' – über 16 MB, bitte Qualität oder Dauer senken.' : ''),
      !!over, true,
    );
  }

  function dlError(err) {
    const c = err && err.code;
    if (c === 'declined') return 'Speichern abgebrochen.';
    if (c === 'too_large') return 'Datei über 16 MB – Qualität oder Dauer senken.';
    if (c === 'rate_limited') return 'Noch ein Dialog offen – kurz warten.';
    if (c === 'rejected_extension' || c === 'extension_not_enabled') return 'Dieses Format lässt sich hier nicht speichern.';
    return 'Speichern hier nicht möglich – nimm den Bildschirm auf.';
  }

  async function saveRec() {
    if (!recBlob) return;
    const name = 'prallwerk-' + P.shape + '-' + seed + '.' + recExt;
    if (dl) {
      try {
        const r = await dl.save({ filename: name, data: recBlob });
        exportMsg(r.status === 'saved' ? 'Gespeichert: ' + name : 'Übergeben: ' + name, false, true);
      } catch (err) {
        exportMsg(dlError(err), true, true);
      }
      return;
    }
    const url = URL.createObjectURL(recBlob);
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    exportMsg('Download gestartet: ' + name, false, true);
  }

  /* ---------------------------------------------------------------- Editor
     Eigene Hindernisse liegen in world.custom, überstehen jeden Neustart und
     laufen durch dieselbe Kollisionsroutine wie die erzeugten Barrieren. */
  let editMode = false, tool = 'move', selected = null, drag = null, pendingImg = null;

  const objX = (o) => (o.t === 'bar' ? o.cx : o.x);
  const objY = (o) => (o.t === 'bar' ? o.cy : o.y);
  const objRadius = (o) => (o.t === 'bar' ? o.len / 2 + o.h
    : o.t === 'peg' ? o.r : Math.hypot(o.w, o.h) / 2);
  function setObjPos(o, x, y) {
    if (o.t === 'bar') { o.cx = x; o.cy = y; } else { o.x = x; o.y = y; }
  }
  const objSize = (o) => (o.t === 'peg' ? o.r * 2 : o.t === 'bar' ? o.len : o.w);
  function setObjSize(o, v) {
    if (o.t === 'peg') o.r = Math.max(5, v / 2);
    else if (o.t === 'bar') { o.len = Math.max(20, v); o.h = Math.max(4, v * 0.07); }
    else { const asp = o.h / o.w; o.w = Math.max(20, v); o.h = o.w * asp; }
  }

  /** Fängt Koordinaten auf ein 20-px-Raster, wenn eingeschaltet. */
  const fang = (v) => (P.snap ? Math.round(v / 20) * 20 : v);

  function toWorld(e) {
    const r = canvas.getBoundingClientRect();
    return {
      x: fang(((e.clientX - r.left) / r.width) * W),
      y: fang(((e.clientY - r.top) / r.height) * H),
    };
  }

  function pick(p) {
    for (let i = world.custom.length - 1; i >= 0; i--) {
      const o = world.custom[i];
      if (Math.hypot(p.x - objX(o), p.y - objY(o)) <= objRadius(o) + 14) return o;
    }
    return null;
  }

  function select(o) { selected = o; syncEditor(); }

  function removeObj(o) {
    const i = world.custom.indexOf(o);
    if (i >= 0) world.custom.splice(i, 1);
    if (selected === o) selected = null;
    syncEditor();
  }

  function edHint(text) {
    const n = el('edHint');
    if (n) n.textContent = text;
  }

  function editDown(e) {
    if (!editMode) return;
    e.preventDefault();
    try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* nicht überall da */ }
    const p = toWorld(e);
    if (tool === 'bar') { drag = { start: p, now: p }; return; }
    if (tool === 'peg') {
      select(world.custom[world.custom.push({ t: 'peg', x: p.x, y: p.y, r: Math.max(6, P.editSize / 2), om: 0 }) - 1]);
      return;
    }
    if (tool === 'img') {
      if (!pendingImg) { edHint('Erst ein Bild laden, dann ins Bild tippen.'); return; }
      const img = pendingImg.img;
      const w = P.editSize * 2.4;
      const h = (w * (img.naturalHeight || 1)) / (img.naturalWidth || 1);
      const o = {
        t: 'img', x: p.x, y: p.y, w, h, a: 0, om: 0,
        src: pendingImg.src, img, mask: pendingImg.mask,
      };
      setFrames(o, pendingImg.frames);
      world.custom.push(o);
      select(o);
      return;
    }
    if (tool === 'start') {
      world.spawn = { x: p.x, y: p.y };
      edHint('Startpunkt gesetzt – Neustart lässt die Bälle dort beginnen.');
      return;
    }
    if (tool === 'erase') { const o = pick(p); if (o) removeObj(o); return; }
    const o = pick(p);
    select(o);
    if (o) drag = { obj: o, dx: objX(o) - p.x, dy: objY(o) - p.y };
  }

  function editMove(e) {
    if (!editMode || !drag) return;
    const p = toWorld(e);
    if (drag.obj) setObjPos(drag.obj, p.x + drag.dx, p.y + drag.dy);
    else drag.now = p;
  }

  function editUp(e) {
    if (!editMode || !drag) return;
    if (!drag.obj) {
      const p = toWorld(e), st = drag.start;
      const dx = p.x - st.x, dy = p.y - st.y, len = Math.hypot(dx, dy);
      if (len > 40) {
        select(world.custom[world.custom.push({
          t: 'bar', cx: (st.x + p.x) / 2, cy: (st.y + p.y) / 2, len,
          h: Math.max(5, P.editSize * 0.14), a: Math.atan2(dy, dx), om: 0,
        }) - 1]);
      } else {
        edHint('Für einen Balken einen Strich ziehen.');
      }
    }
    drag = null;
  }

  function setEdit(on) {
    editMode = on;
    const b = el('btnEdit');
    b.textContent = on ? 'Fertig' : 'Bearbeiten';
    b.classList.toggle('primary', on);
    const bezel = document.querySelector('.bezel');
    if (bezel) bezel.classList.toggle('editing', on);
    canvas.style.cursor = on ? 'crosshair' : '';
    if (on) { setRunning(false); edHint(pendingImg ? 'Bild bereit – ins Bild tippen.' : 'Werkzeug wählen und ins Bild tippen.'); }
    else { selected = null; drag = null; syncEditor(); setRunning(true); }
  }

  function syncTools() {
    const box = el('edTools');
    if (!box) return;
    for (const b of box.children) b.setAttribute('aria-pressed', String(b.dataset.tool === tool));
  }

  function syncEditor() {
    const box = el('edSel');
    if (!box) return;
    box.hidden = !selected;
    el('edCount').textContent = world.custom.length
      ? world.custom.length + (world.custom.length === 1 ? ' Hindernis' : ' Hindernisse')
      : 'noch nichts gesetzt';
    if (!selected) return;
    const gr = Math.round(objSize(selected));
    el('edSize').value = String(gr);
    el('edSizeV').textContent = gr + ' px';
    const rot = Math.round(((selected.a || 0) * 180) / Math.PI);
    el('edRot').value = String(rot);
    el('edRotV').textContent = rot + ' °';
    const spin = Math.round(((selected.om || 0) * 180) / Math.PI);
    el('edSpin').value = String(spin);
    el('edSpinV').textContent = spin + ' °/s';
    el('edRotRow').hidden = selected.t === 'peg';
    el('edSolid').checked = selected.solid !== false;
  }

  function readAsDataUrl(file) {
    return new Promise((ok, fehler) => {
      const rd = new FileReader();
      rd.onload = () => ok(rd.result);
      rd.onerror = () => fehler(new Error('Datei nicht lesbar'));
      rd.readAsDataURL(file);
    });
  }

  function loadObstacleImage(file) {
    if (!file) return;
    edHint('Lese ' + file.name + ' …');
    const rd = new FileReader();
    rd.onerror = () => edHint('Die Datei ließ sich nicht lesen.');
    rd.onload = async () => {
      let vor;
      try { vor = await prepareImage(rd.result); }
      catch (err) { edHint('Dieses Bild ließ sich nicht laden.'); return; }
      pendingImg = { img: vor.img, src: rd.result, mask: vor.mask, frames: vor.frames };
      tool = 'img';
      syncTools();
      if (!editMode) setEdit(true);
      const zusatz = vor.frames ? ' · ' + vor.frames.length + ' Einzelbilder'
        : (vor.mask ? '' : ' (ohne Alphakanal: Kollision als Rechteck)');
      edHint(file.name + ' bereit' + zusatz + ' – jetzt ins Bild tippen.');
    };
    rd.readAsDataURL(file);
  }

  function levelData() {
    return {
      v: 3,
      start: world.spawn,
      baelle: ballLooks.map((l) => l.src),
      kaempfer: fighters.map((f) => ({
        name: f.name, ability: f.ability, hp: f.hp, dmg: f.dmg, rate: f.rate,
        color: f.color, src: f.src,
      })),
      objekte: world.custom.map((o) => (o.t === 'img'
        ? { t: 'img', x: o.x, y: o.y, w: o.w, h: o.h, a: o.a, om: o.om, src: o.src, solid: o.solid !== false }
        : o.t === 'bar'
          ? { t: 'bar', cx: o.cx, cy: o.cy, len: o.len, h: o.h, a: o.a, om: o.om, solid: o.solid !== false }
          : { t: 'peg', x: o.x, y: o.y, r: o.r, om: 0, solid: o.solid !== false })),
    };
  }

  async function saveLevel() {
    const text = JSON.stringify(levelData());
    const name = 'prallwerk-level.json';
    if (dl) {
      try { await dl.save({ filename: name, data: text }); edHint('Level gesichert.'); }
      catch (err) { edHint(dlError(err)); }
      return;
    }
    const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    const a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    edHint('Level gesichert.');
  }

  function addLevelObject(roh) {
    if (roh.t === 'img') {
      const o = {
        t: 'img', x: +roh.x, y: +roh.y, w: +roh.w, h: +roh.h,
        a: +roh.a || 0, om: +roh.om || 0, src: roh.src, img: null, mask: null,
        solid: roh.solid !== false,
      };
      prepareImage(roh.src).then((vor) => {
        o.img = vor.img;
        o.mask = vor.mask;
        setFrames(o, vor.frames);
      }).catch(() => { /* dann bleibt es unsichtbar und ohne Kollision */ });
      world.custom.push(o);
    } else if (roh.t === 'bar') {
      world.custom.push({
        t: 'bar', cx: +roh.cx, cy: +roh.cy, len: +roh.len,
        h: +roh.h || 8, a: +roh.a || 0, om: +roh.om || 0, solid: roh.solid !== false,
      });
    } else if (roh.t === 'peg') {
      world.custom.push({
        t: 'peg', x: +roh.x, y: +roh.y, r: +roh.r || 20, om: 0, solid: roh.solid !== false,
      });
    }
  }

  function loadLevel(file) {
    if (!file) return;
    const rd = new FileReader();
    rd.onerror = () => edHint('Die Datei ließ sich nicht lesen.');
    rd.onload = () => {
      try {
        const data = JSON.parse(rd.result);
        if (!data || !Array.isArray(data.objekte)) throw new Error('Format');
        world.custom.length = 0;
        selected = null;
        for (const roh of data.objekte) addLevelObject(roh);
        world.spawn = data.start && isFinite(data.start.x) ? { x: +data.start.x, y: +data.start.y } : null;
        if (Array.isArray(data.baelle)) {
          ballLooks.length = 0;
          for (const src of data.baelle.slice(0, 12)) {
            prepareImage(src).then((vor) => { addBallLook(vor, src); ballLookHint(); }).catch(() => {});
          }
        }
        if (Array.isArray(data.kaempfer)) {
          data.kaempfer.slice(0, 6).forEach((roh, i) => {
            const f = fighters[i];
            if (!roh || !f) return;
            f.name = String(roh.name || f.name).slice(0, 18);
            f.ability = ABILITIES[roh.ability] ? roh.ability : f.ability;
            f.hp = +roh.hp || f.hp;
            f.dmg = +roh.dmg || f.dmg;
            f.rate = +roh.rate || f.rate;
            f.color = String(roh.color || f.color);
            f.src = roh.src || null;
            f.look = null;
            if (f.src) prepareImage(f.src).then((vor) => { f.look = makeLook(vor, f.src); }).catch(() => {});
          });
          buildFightTabs();
        }
        syncEditor();
        edHint(world.custom.length + ' Hindernisse geladen'
          + (world.spawn ? ', Startpunkt gesetzt' : '') + '.');
      } catch (err) {
        edHint('Das war keine Prallwerk-Leveldatei.');
      }
    };
    rd.readAsText(file);
  }

  function editorPanel() {
    const wrap = document.createElement('div');
    wrap.innerHTML =
      '<div class="row"><span class="note">Hindernisse direkt ins Bild setzen. Sie bleiben '

      + '<button type="button" class="btn" data-tool="peg">Kreis</button>'
      + '<button type="button" class="btn" data-tool="img">Bild</button>'
      + '<button type="button" class="btn" data-tool="erase">Weg</button>'
      + '<button type="button" class="btn" data-tool="start">Start</button>'
      + '</div>'
      + '<label class="filebtn wide" id="edImgBtn" style="margin-top:8px">'
      + 'Bild laden · PNG · animiertes GIF · JPG<input type="file"></label>'

  function levelActions() {
    const wrap = document.createElement('div');
    wrap.className = 'ed-actions';
    wrap.innerHTML = '<button type="button" class="btn" id="edSave">Level sichern</button>'
      + '<label class="filebtn" id="edLoadBtn">Level laden<input type="file"></label>'
      + '<button type="button" class="btn" id="edClear">Alles leeren</button>';
    return wrap;
  }

  function wireEditor() {
    el('edTools').addEventListener('click', (e) => {
      const b = e.target.closest('button[data-tool]');
      if (!b) return;
      tool = b.dataset.tool;
      syncTools();
      if (!editMode) setEdit(true);
    });
    el('edClear').addEventListener('click', () => {
      world.custom.length = 0;
      world.spawn = null;
      selected = null;
      syncEditor();
      edHint('Eigene Hindernisse und Startpunkt entfernt.');
    });
    el('edImgBtn').querySelector('input').addEventListener('change', (e) => {
      loadObstacleImage(e.target.files && e.target.files[0]);
      e.target.value = '';
    });
    el('edLoadBtn').querySelector('input').addEventListener('change', (e) => {
      loadLevel(e.target.files && e.target.files[0]);
      e.target.value = '';
    });
    el('edSave').addEventListener('click', saveLevel);
    el('edDel').addEventListener('click', () => { if (selected) removeObj(selected); });
    el('edSolid').addEventListener('change', (e) => {
      if (selected) selected.solid = e.target.checked;
    });
    el('edDup').addEventListener('click', () => {
      if (!selected) return;
      // Flache Kopie: Maske, Bild und Einzelbilder werden geteilt, nicht kopiert.
      const k = Object.assign({}, selected);
      setObjPos(k, objX(k) + 40, objY(k) + 40);
      world.custom.push(k);
      select(k);
    });
    el('edBack').addEventListener('click', () => {
      if (!selected) return;
      const i = world.custom.indexOf(selected);
      if (i > 0) { world.custom.splice(i, 1); world.custom.unshift(selected); }
      syncEditor();
    });
    el('edSize').addEventListener('input', (e) => {
      if (selected) { setObjSize(selected, +e.target.value); syncEditor(); }
    });
    el('edRot').addEventListener('input', (e) => {
      if (selected) { selected.a = (+e.target.value * Math.PI) / 180; syncEditor(); }
    });
    el('edSpin').addEventListener('input', (e) => {
      if (selected) { selected.om = (+e.target.value * Math.PI) / 180; syncEditor(); }
    });
    canvas.addEventListener('pointerdown', editDown);
    canvas.addEventListener('pointermove', editMove);
    canvas.addEventListener('pointerup', editUp);
    canvas.addEventListener('pointercancel', () => { drag = null; });
    el('btnEdit').addEventListener('click', () => setEdit(!editMode));
    syncTools();
    syncEditor();
  }

  /* ---------------------------------------------------------------- Bedienung */
  const rebuildAll = () => { buildShape(); buildBarriers(); };
  const rebuildBarriers = () => buildBarriers();

  const rng = (key, label, min, max, step, fmt, apply) =>
    ({ kind: 'range', key, label, min, max, step, fmt, apply });
  const sel = (key, label, opts, apply, num) =>
    ({ kind: 'select', key, label, opts, apply, num });
  const tog = (key, label, apply) => ({ kind: 'toggle', key, label, apply });
  const txt = (key, label) => ({ kind: 'text', key, label });

  const pct = (v) => Math.round(v * 100) + ' %';
  const deg = (v) => v + ' °/s';
  const px = (v) => v + ' px';

  const MODULES = [
    {
      title: 'Form', hint: 'Rahmen',
      rows: [
        sel('shape', 'Form', Object.keys(SHAPES).map((k) => [k, SHAPES[k].name]), rebuildAll),
        rng('size', 'Größe', 0.5, 1, 0.01, pct, rebuildAll),
        rng('spin', 'Eigendrehung', -90, 90, 1, deg, () => { world.om = (P.spin * Math.PI) / 180; }),
        rng('wall', 'Wandstärke', 4, 30, 1, px),
        tog('wallShow', 'Rahmen zeigen'),
      ],
    },
    {
      title: 'Barrieren', hint: 'Hindernisse',
      rows: [
        sel('barrier', 'Aufbau', Object.keys(BARRIERS).map((k) => [k, BARRIERS[k]]), rebuildBarriers),
        rng('bCount', 'Menge', 1, 7, 1, (v) => String(v), rebuildBarriers),
        rng('bSpeed', 'Drehtempo', 0, 220, 5, deg, rebuildBarriers),

  function buildFightTabs() {
    const box = el('fTabs');
    if (!box) return;
    const k = kaempferZahl();
    if (fSel >= k) fSel = 0;
    box.innerHTML = '';
    for (let i = 0; i < k; i++) {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'btn';
      b.textContent = String(i + 1);
      b.dataset.f = String(i);
      b.style.borderColor = fighters[i].color;
      b.addEventListener('click', () => { fSel = i; syncFight(); });
      box.appendChild(b);
    }
    syncFight();
  }

  function syncFight() {
    const box = el('fTabs');
    if (!box) return;
    for (const b of box.children) b.setAttribute('aria-pressed', String(+b.dataset.f === fSel));
    const f = fighters[fSel];
    el('fName').value = f.name;
    el('fAbility').value = f.ability;
    el('fInfo').textContent = ABILITIES[f.ability].info;
    el('fHp').value = String(f.hp);
    el('fHpV').textContent = f.hp + ' HP';
    el('fDmg').value = String(f.dmg);
    el('fDmgV').textContent = f.dmg + ' HP';
    el('fRate').value = String(f.rate);
    el('fRateV').textContent = f.rate.toFixed(1).replace('.', ',') + ' s';
    el('fColor').value = f.color;
    const h = el('fImgHint');
    h.textContent = f.look ? 'Eigenes Bild gesetzt.' : 'Ohne Bild: einfarbige Kugel.';
    h.classList.toggle('on', !!f.look);
  }

  function refreshFightUI() {
    const m = el('fightMod');
    if (m) m.classList.toggle('muted', !P.fight);
  }

  function wireFight() {
    const sel2 = el('fAbility');
    for (const k of Object.keys(ABILITIES)) {
      const o = document.createElement('option');
      o.value = k;
      o.textContent = ABILITIES[k].name;
      sel2.appendChild(o);
    }
    el('fName').addEventListener('input', (e) => { fighters[fSel].name = e.target.value; });
    sel2.addEventListener('change', (e) => {
      fighters[fSel].ability = e.target.value;
      syncFight();
      if (P.fight) { reset(); setRunning(true); }
    });
    el('fHp').addEventListener('input', (e) => { fighters[fSel].hp = +e.target.value; syncFight(); });
    el('fDmg').addEventListener('input', (e) => { fighters[fSel].dmg = +e.target.value; syncFight(); });
    el('fRate').addEventListener('input', (e) => { fighters[fSel].rate = +e.target.value; syncFight(); });
    el('fColor').addEventListener('input', (e) => {
      fighters[fSel].color = e.target.value;
      buildFightTabs();
    });
    el('fImgBtn').querySelector('input').addEventListener('change', async (e) => {
      const datei = e.target.files && e.target.files[0];
      e.target.value = '';
      if (!datei) return;
      const h = el('fImgHint');
      h.textContent = 'Lese ' + datei.name + ' …';
      try {
        const src = await readAsDataUrl(datei);
        const f = fighters[fSel];
        f.src = src;
        f.look = makeLook(await prepareImage(src), src);
        for (const b of world.balls) if (b.fi === fSel) b.look = f.look;
        syncFight();
      } catch (err) {
        h.textContent = 'Dieses Bild ließ sich nicht laden.';
      }
    });
    buildFightTabs();
    refreshFightUI();
  }

    // Ablegen per Ziehen geht auch.

      const h = document.createElement('h2');

      for (const cfg of mod.rows) box.appendChild(buildRow(cfg));
      if (mod.extra) mod.extra(box);
      rail.appendChild(box);
    }

  function buildRow(cfg) {
    if (cfg.kind === 'custom') return cfg.build();
    const row = document.createElement('div');
    row.className = 'row';
    const id = 'c_' + cfg.key;
    const lab = document.createElement('label');
    lab.textContent = cfg.label;
    lab.htmlFor = id;
    row.appendChild(lab);

    if (cfg.kind === 'range') {
      const out = document.createElement('span');
      out.className = 'val';
      out.textContent = cfg.fmt(P[cfg.key]);
      row.appendChild(out);
      const i = document.createElement('input');
      i.type = 'range'; i.id = id; i.className = 'wide';
      i.min = cfg.min; i.max = cfg.max; i.step = cfg.step; i.value = P[cfg.key];
      i.addEventListener('input', () => {
        P[cfg.key] = parseFloat(i.value);
        out.textContent = cfg.fmt(P[cfg.key]);
        if (cfg.apply) cfg.apply();
      });
      row.appendChild(i);
      controls[cfg.key] = () => { i.value = P[cfg.key]; out.textContent = cfg.fmt(P[cfg.key]); };

    } else if (cfg.kind === 'select') {
      const s = document.createElement('select');
      s.id = id; s.className = 'wide';
      for (const [v, t] of cfg.opts) {
        const o = document.createElement('option');
        o.value = String(v); o.textContent = t;
        s.appendChild(o);
      }
      s.value = String(P[cfg.key]);
      s.addEventListener('change', () => {
        P[cfg.key] = cfg.num ? Number(s.value) : s.value;
        if (cfg.apply) cfg.apply();
      });
      row.appendChild(s);
      controls[cfg.key] = () => { s.value = String(P[cfg.key]); };

    } else if (cfg.kind === 'toggle') {
      const c = document.createElement('input');
      c.type = 'checkbox'; c.className = 'sw'; c.id = id;
      c.checked = !!P[cfg.key];
      c.addEventListener('change', () => {
        P[cfg.key] = c.checked;
        if (cfg.apply) cfg.apply();
      });
      row.appendChild(c);
      controls[cfg.key] = () => { c.checked = !!P[cfg.key]; };

    } else {
      const t = document.createElement('input');
      t.type = 'text'; t.id = id; t.className = 'wide';
      t.maxLength = 42; t.value = P[cfg.key];
      t.addEventListener('input', () => { P[cfg.key] = t.value; });
      row.appendChild(t);
      controls[cfg.key] = () => { t.value = P[cfg.key]; };
    }
    return row;
  }

      shape: 'star5', size: 0.98, spin: -26, wall: 12, barrier: 'orbit', bCount: 4, bSpeed: 70,
      gravity: 2600, bounce: 1.06, startSpeed: 950, ballSize: 24, tempo: 1,
      split: 'chance', splitChance: 24, maxBalls: 240, spread: 40, shrink: true,
      palette: 'sunset', colorMode: 'hit', trail: 60, bg: 'studio', target: 240,
      hudTitle: 'STERN OHNE AUSGANG', melSrc: 'builtin', melPick: 'elise', instrument: 'klavier' } },
    { id: 'herz', name: 'Herzschlag', patch: {
      shape: 'heart', size: 0.98, spin: 0, wall: 15, barrier: 'bars', bCount: 3, bSpeed: 60,
      gravity: 2300, bounce: 1.01, startSpeed: 800, ballSize: 26, tempo: 1,
      split: 'chance', splitChance: 16, maxBalls: 160, spread: 30, shrink: true,
      palette: 'brass', colorMode: 'hit', trail: 58, bg: 'studio', target: 160,
      hudTitle: 'FÜR DICH', melSrc: 'builtin', melPick: 'ode', instrument: 'marimba' } },
  ];

  function buildPresets() {
    const wrap = el('presets');
    for (const p of PRESETS) {
      const b = document.createElement('button');
      b.className = 'chip';
      b.type = 'button';
      b.textContent = p.name;
      b.dataset.preset = p.id;
      b.setAttribute('aria-pressed', 'false');
      b.addEventListener('click', () => applyPreset(p));
      wrap.appendChild(b);
    }
  }

  function applyPreset(p) {
    Object.assign(P, p.patch);
    for (const k in controls) controls[k]();
    for (const b of el('presets').children) {
      b.setAttribute('aria-pressed', String(b.dataset.preset === p.id));
    }
    paintBackground();
    refreshMelody();
    reset();
    setRunning(true);
  }

  /* ---------------------------------------------------------------- Anzeige */
  let fps = 60;
  function updateReadout() {
    el('mBalls').textContent = String(world.balls.length);
    el('mHits').textContent = String(world.hits);
    el('mTime').textContent = world.time.toFixed(1).replace('.', ',') + ' s';
    el('mFps').textContent = String(Math.round(fps));
    el('mSeed').textContent = String(seed).padStart(4, '0');
    melStatus();
    if (schnipselModus() && song.label) songStatus(song.label + ' · bei ' + fmtClock(songPos), true);
    else if (anspielModus() && song.label) {
      songStatus(song.label + (unlocked ? ' · läuft durch'
        : ' · frei ab ' + freiAb() + ' Bällen (noch ' + Math.max(0, freiAb() - world.balls.length) + ')'), true);
    }
  }
  /* Die Schiene bekommt genau die Höhe, die unter dem Kopf frei ist – so ist
     sie auch ungescrollt vollständig sichtbar und scrollt nur in sich selbst. */
  function fitRail() {
    const rail = el('rail');
    if (window.innerWidth <= 1000) { rail.style.maxHeight = ''; return; }
    const top = rail.getBoundingClientRect().top + window.scrollY;
    rail.style.maxHeight = Math.max(360, window.innerHeight - top - 20) + 'px';
  }

  function syncPlay() {
    el('btnPlay').textContent = world.running ? 'Pause' : 'Start';
  }
  /** Start/Pause zieht die Musik mit – sonst läuft der Song ohne Bild weiter. */
  function setRunning(v) {
    const was = world.running;
    world.running = v;
    if (songBereit() && P.songMode === 'loop' && was !== v) {
      if (v) startSong(songPos); else stopSong();
    }
    syncPlay();
  }
  function exportMsg(text, warn, withSave) {
    const box = el('exportOut');
    box.hidden = false;
    box.classList.toggle('warn', !!warn);
    el('exportText').textContent = text;
    el('btnSave').hidden = !withSave;
  }

  /* ---------------------------------------------------------------- Schleife */
  let acc = 0, last = performance.now(), tick = 0;
  function frame(now) {
    requestAnimationFrame(frame);
    const real = Math.min(0.1, (now - last) / 1000);
    last = now;
    if (real > 0.0005) fps += (1 / real - fps) * 0.06;
    pumpBeats();

    if (world.running) {
      acc += real * P.tempo * warp;
      let n = 0;
      while (acc >= STEP && n < 4) {
        for (let s = 0; s < SUB; s++) substep(DT);
        acc -= STEP;
        n++;
      }
      if (acc > STEP * 4) acc = 0;
    }
    draw();

    // Nach dem Sieg kurz stehen lassen, damit der Schriftzug im Video bleibt.
    if (P.fight && world.winner !== null && world.running && world.time - world.overAt > 2.5) {
      setRunning(false);
    }
    if (recording) {
      const t = (now - recStart) / 1000;
      el('recSize').textContent = 'REC ' + t.toFixed(1).replace('.', ',') + ' s';
      if (P.recLimit > 0 && t >= P.recLimit) stopRec();
    }
    if (tick++ % 6 === 0) updateReadout();
  }

  /* ---------------------------------------------------------------- Start */
  buildRail();
  buildPresets();
  wireEditor();
  wireBallLooks();
  wireFight();
  el('presets').firstElementChild.setAttribute('aria-pressed', 'true');
  setRes(P.outRes);
  reset();

  el('btnPlay').addEventListener('click', () => setRunning(!world.running));
  el('btnReset').addEventListener('click', () => { reset(); setRunning(true); });
  el('btnSeed').addEventListener('click', () => {
    seed = Math.floor(Math.random() * 9000) + 1000;
    reset();
    setRunning(true);
  });
  el('btnRec').addEventListener('click', () => (recording ? stopRec() : startRec()));
  el('btnSave').addEventListener('click', saveRec);

  document.addEventListener('keydown', (e) => {
    const t = e.target;
    if (t && /^(INPUT|SELECT|TEXTAREA)$/.test(t.tagName)) return;
    if (e.code === 'Space') { e.preventDefault(); setRunning(!world.running); }
    else if (e.key === 'r' || e.key === 'R') { reset(); setRunning(true); }
    else if (e.key === 'n' || e.key === 'N') { seed = Math.floor(Math.random() * 9000) + 1000; reset(); }
  });

  // Ton darf erst nach einer Nutzeraktion starten.
  fitRail();
  window.addEventListener('resize', fitRail);

  document.addEventListener('pointerdown', audioResume, { once: true });
  document.addEventListener('keydown', audioResume, { once: true });

  seed = Math.floor(Math.random() * 9000) + 1000;
  reset();
  refreshRhythm();
  refreshMelody();
  syncPlay();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
